  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-pin:
    name: X-Insight Protocol Pin
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: xinsight_admin
          POSTGRES_PASSWORD: xinsight
          POSTGRES_DB: xinsight_protocol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGAPPNAME=xinsight_protocol_health pg_isready -q -U xinsight_admin -d xinsight_protocol"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      XINSIGHT_POSTGRES_DSN: postgres://xinsight_admin:xinsight@localhost:5432/xinsight_protocol?sslmode=disable
    steps:
      - name: Checkout X-Insight
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run pinned cross-language Conformance kit and verify X-Insight pin
        uses: foigent/event-connector-spec/actions/source-neutral-v2@ad8fe7a38c9d7335657630baa8670dd07556b98c
        with:
          pin: contracts/foigent/event-connector-protocol.pin.json
          product: xinsight

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false

      - name: Validate fixed Execution Evidence Draft Gate
        run: |
          go run ./cmd/xinsight-draft-evidence-validator \
            --repository-root . \
            --report "${RUNNER_TEMP}/execution-evidence-draft-conformance.json"
          python3 scripts/check-draft-evidence-history.py --self-test

      - name: Enforce historical Draft fixture and manifest immutability
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/check-draft-evidence-history.py \
              --event pull_request --base "$PR_BASE_SHA" --head "$HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            python3 scripts/check-draft-evidence-history.py \
              --event push --base "$PUSH_BASE_SHA" --head "$HEAD_SHA"
          else
            python3 scripts/check-draft-evidence-history.py --event current
          fi

      - name: Upload Execution Evidence Draft conformance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: execution-evidence-draft-conformance-${{ github.run_id }}
          path: ${{ runner.temp }}/execution-evidence-draft-conformance.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify Phase 2C single-writer Reference runtime
        run: bash scripts/verify-phase2c-reference-runtime.sh

      - name: Verify completed-execution runtime and differential compatibility
        run: >-
          go test
          ./internal/connector
          ./internal/adapters/unirouter
          ./internal/integration/pullfeed
          -run '^(TestFoigentReferenceBridge|TestPhase2B|TestCompletedExecutionReferenceRuntime|TestModeAwareCommitter|TestReferenceProjectionComparator|TestReferenceNeutralCanary)'
          -count=1

      - name: Verify dormant OpenInference bounded-offline receipt boundary
        run: >-
          go test
          ./internal/connector
          ./internal/adapters/openinference
          ./internal/integration/openinferenceoffline
          ./cmd/xinsight-importer
          -count=1

      - name: Verify LiteLLM Reference runtime boundaries
        run: bash scripts/verify-phase2c-litellm-runtime.sh

      - name: Verify LiteLLM projection and durable PostgreSQL convergence
        run: bash scripts/ci/run-litellm-postgres-convergence.sh

  litellm-component:
    name: LiteLLM v1.93.0 Component Integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: xinsight_admin
          POSTGRES_PASSWORD: xinsight
          POSTGRES_DB: litellm_component_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "PGAPPNAME=litellm_component_source_health pg_isready -q -U xinsight_admin -d litellm_component_source"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      XINSIGHT_POSTGRES_DSN: postgres://xinsight_admin:xinsight@localhost:5432/xinsight_litellm_component?sslmode=disable
      LITELLM_COMPONENT_SOURCE_POSTGRES_DSN: postgres://xinsight_admin:xinsight@localhost:5432/litellm_component_source?sslmode=disable
    steps:
      - name: Checkout X-Insight
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false

      - name: Install matched PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [arch=amd64 signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_dump --version

      - name: Run pinned LiteLLM, real PostgreSQL and local-upstream component path
        run: bash scripts/ci/run-litellm-component-integration.sh
