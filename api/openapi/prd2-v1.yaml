      responses:
        '200':
          description: Fully verified bytes; authorization and expiry are checked during publication
          headers:
            X-XInsight-Scope-Revision: {description: Current human authorization revision, schema: {type: string}}
            X-UR-Content-Metadata: {description: Original canonical base64url read metadata; its frozen reference is unchanged, schema: {type: string}}
