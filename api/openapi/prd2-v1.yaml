      type: object
      additionalProperties: false
      required: [scope, reporter, target, request_id, record_ref, revision, record_hash, relation]
      properties:
        scope: {type: string, enum: [finding, case]}
        reporter: {$ref: '#/components/schemas/ResourceScope'}
        target: {$ref: '#/components/schemas/ResourceScope'}
        request_id: {$ref: '#/components/schemas/ResourceRef'}
        record_ref: {$ref: '#/components/schemas/ResourceRef'}
        revision: {type: integer, minimum: 1, maximum: 1000000}
        record_hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        relation: {type: string, enum: [supports, contradicts, context]}
      description: Names one retained immutable revision with full reporter and target identity. Does not depend on a short-lived reading or follow later revisions. Online access rechecks both sides; restoration validates historical content without requiring the actor to remain authorized.
    ReviewAdoptedResource:
      type: object
      additionalProperties: false
      required: [reference, record]
      properties:
        reference: {$ref: '#/components/schemas/ReviewResourceChoice'}
        record: {$ref: '#/components/schemas/ResourceAccessRecord'}
      description: Preserves the accepted source JSON including explicit optional empty fields and timestamp spelling; original source hash is verified without typed reserialization.
    CaseResourceLink:
      type: object
      additionalProperties: false
      required: [case_id, reference, added_by_subject, added_at]
      properties:
        case_id: {type: string}
        finding_id: {type: string}
        reference: {$ref: '#/components/schemas/ReviewResourceChoice'}
        added_by_subject: {type: string}
        added_at: {type: string, format: date-time}
    ReviewBasisSelectionInput:
      type: object
      additionalProperties: false
      required:
      - evidence
      - gaps
      properties:
        contents: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ReviewContentChoice'}}
        resources: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ReviewResourceChoice'}}
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ReviewEvidenceInput'
          maxItems: 32
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/ReviewGapChoice'
          maxItems: 32
      description: Combined Evidence, Gap, resource and content limit is 32. Unique by scope, ID and relation. Known references are Finding-scoped.
        Selected Case references must be explicit.
    ReviewBasisSelection:
      type: object
      additionalProperties: false
      required:
      - evidence
      - gaps
      properties:
        contents: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ReviewContentChoice'}}
        resources: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ReviewResourceChoice'}}
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ReviewEvidenceChoice'
          maxItems: 32
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/ReviewGapChoice'
          maxItems: 32
      description: Combined Evidence, Gap, resource and content limit is 32. Unique by scope, ID and relation. Known references are Finding-scoped.
        Selected Case references must be explicit.
    ReviewKnownReferences:
      type: object
      additionalProperties: false
      required:
      - evidence
      - gaps
      properties:
        contents: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/ReviewContentChoice'}}
        resources: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/ReviewResourceChoice'}}
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ReviewEvidenceChoice'
          maxItems: 128
        gaps:
          type: array
          items:
            $ref: '#/components/schemas/ReviewGapChoice'
          maxItems: 128
      description: Combined Evidence, Gap, resource and content limit is 128. Unique by scope, ID and relation. Known references are Finding-scoped.
        Selected Case references must be explicit.
    ReviewAdoptedGap:
      type: object
      additionalProperties: false
      required:
      - reference
      - resolution_recorded
      - resolution_version
      - state
      - note
      - updated_by_subject
      - updated_at
      properties:
        reference:
          $ref: '#/components/schemas/ReviewGapChoice'
        resolution_recorded:
          type: boolean
        resolution_version:
          type: integer
          minimum: 0
        state:
          type: string
          enum:
          - ''
          - open
          - investigating
          - source_fixed
          - accepted_limitation
          - superseded
        note:
          type: string
          maxLength: 4000
        updated_by_subject:
          type: string
          maxLength: 67
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      description: Exact version and contents from the same visible resolution row. Unrecorded means version 0, empty
        state/note/subject and null time, never an inferred open state. Historical reads and restore do not join the
        latest resolution.
    ReviewExecutionContext:
      type: object
      additionalProperties: false
      required: [workbench_reading_id, execution_id, execution_as_of, runtime_reading_id, runtime_request_ref]
      properties:
        workbench_reading_id: {type: string, pattern: '^xwr_[A-Za-z0-9_-]{22}$'}
        execution_id: {type: string, pattern: '^xe1_[a-f0-9]{64}$'}
        execution_as_of: {type: string, format: date-time}
        runtime_reading_id: {type: string, pattern: '^xrt_[A-Za-z0-9_-]{22}$'}
        runtime_request_ref: {type: string, pattern: '^xrr_[a-f0-9]{64}$'}
      description: Optional start_review context for selected finding resources and/or content. Execution cutoff must exactly match the owned cost reading cutoff (microsecond precision); runtime cutoff remains independent. First creation validates live readings, full frozen economic/request/resource/content membership and current grants within the same transaction, including database time after locks at commit. Content must match the full execution identity and frozen runtime reference and remain unexpired at creation commit. Invalid context never falls back to unlinked creation; pure content review without this optional context remains legal. No Evidence or Gap is inferred.
    ReviewResolvedExecutionContext:
      type: object
      additionalProperties: false
      required: [context, runtime_cutoff, workbench_membership_ref, runtime_membership_ref, target, request_id, resources]
      properties:
        context: {$ref: '#/components/schemas/ReviewExecutionContext'}
        runtime_cutoff: {type: string, format: date-time}
        workbench_membership_ref: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        runtime_membership_ref: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        target: {$ref: '#/components/schemas/ResourceScope'}
        request_id: {type: string}
        resources: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ReviewResourceChoice'}}
        contents: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/ReviewContentChoice'}}
      anyOf:
        - properties: {resources: {minItems: 1}}
        - required: [contents]
      description: Immutable creation origin bound by the basis digest and receipt. Later evaluations and history use retained Case execution and exact resource/content links without requiring either navigation reading to survive; current access is still mandatory online. Omitting contents preserves existing resource-origin bytes and digests, including historical mixed selections whose origin only bound resources. New creations bind every selected content reference; combined resources and contents are limited to 32. Omitting the entire context preserves legacy basis bytes. Older binaries that reject unknown fields cannot read newly context-bearing records or packs; this is not a backwards reader guarantee.
    ReviewBasis:
      type: object
      additionalProperties: false
      required:
      - schema
      - statement
      - finding_version
      - known
      - selected
      - adopted_gaps
      - digest
      properties:
        content_basis_version: {type: string, const: xinsight.review-content-basis.v1}
        resolved_execution_context: {$ref: '#/components/schemas/ReviewResolvedExecutionContext'}
        adopted_resources: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ReviewAdoptedResource'}}
        schema:
          type: string
          enum: [xinsight.review-basis.v1, xinsight.review-basis.v2, xinsight.review-basis.v3]
        statement:
          type: string
          maxLength: 8000
          minLength: 1
        finding_version:
          type: integer
          minimum: 1
        known:
          $ref: '#/components/schemas/ReviewKnownReferences'
        selected:
          $ref: '#/components/schemas/ReviewBasisSelection'
        adopted_gaps:
          type: array
          items:
            $ref: '#/components/schemas/ReviewAdoptedGap'
          maxItems: 32
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
      description: Canonical digest binds statement/version, known versus selected references and actual adopted Gap
        contents and server-resolved immutable resource revisions. Resource-bearing known or selected references use v2; v1 bytes and digests remain unchanged when no resources are present. Excludes observation time and generated Case/Finding IDs. Source unavailability is not unchanged.
    ReviewPayload:
      type: object
      additionalProperties: false
      required:
      - conclusion
      - reason
      properties:
        conclusion:
          type: string
          enum:
          - pending_review
          - supported
          - not_supported
          - insufficient_evidence
        reason:
          type: string
          maxLength: 4000
          minLength: 1
        missing_evidence:
          type: string
          maxLength: 4000
      description: Supported requires selected supports Evidence; not_supported requires contradicts. Insufficient evidence
        needs a selected Gap or explicit missing_evidence. Never changes legacy classification/status or source facts.
    ReviewFindingReference:
      type: object
      additionalProperties: false
      required:
      - case_id
      - finding_id
      properties:
        case_id:
          $ref: '#/components/schemas/CaseId'
        finding_id:
          type: string
          pattern: ^xf_[A-Za-z0-9_-]{22}$
    ReviewSealedFindingReference:
      type: object
      additionalProperties: false
      required:
      - case_id
      - finding_id
      - revision
      - digest
      properties:
        case_id:
          $ref: '#/components/schemas/CaseId'
        finding_id:
          type: string
          pattern: ^xf_[A-Za-z0-9_-]{22}$
        revision:
          type: integer
          minimum: 1
        digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
    ReviewClosure:
      type: object
      additionalProperties: false
      required:
      - kind
      - explanation
      properties:
        kind:
          type: string
          enum:
          - verified_remediation
          - ruled_out
          - duplicate
          - end_followup
        explanation:
          type: string
          maxLength: 4000
          minLength: 1
        scope:
          type: string
          maxLength: 2000
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        verification_resources: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ReviewResourceChoice'}}
        verification_evidence:
          type: array
          items:
            $ref: '#/components/schemas/ReviewEvidenceChoice'
          maxItems: 32
        duplicate:
          anyOf:
          - $ref: '#/components/schemas/ReviewFindingReference'
          - type: 'null'
        remaining_unknowns:
          type: string
          maxLength: 4000
      description: verified_remediation requires human scope/time and selected post-fix Evidence and/or resource references (combined maximum 32), and does not claim
        XI executed a fix. ruled_out needs a not_supported review on this same basis. duplicate needs another visible
        Finding and an acyclic graph, with a human same-claim explanation. end_followup requires remaining unknowns,
        not formal risk acceptance/removal. Fields for other kinds are empty or null.
    ReviewProgressPayload:
      type: object
      additionalProperties: false
      required:
      - state
      - reason
      properties:
        state:
          type: string
          enum:
          - not_started
          - in_progress
          - ended
        reason:
          type: string
          maxLength: 4000
          minLength: 1
        closure:
          anyOf:
          - $ref: '#/components/schemas/ReviewClosure'
          - type: 'null'
      description: Unrecorded first becomes not_started. Then not_started to in_progress/ended, in_progress to ended,
        or ended to in_progress. Only ended has a closure. Review verdict does not change.
    FindingReviewRecord:
      type: object
      additionalProperties: false
      required:
      - conclusion
      - reason
      - missing_evidence
      - basis
      - actor_subject_id
      - at
      properties:
        conclusion:
          type: string
          enum:
          - pending_review
          - supported
          - not_supported
          - insufficient_evidence
        reason:
          type: string
          maxLength: 4000
          minLength: 1
        missing_evidence:
          type: string
          maxLength: 4000
        basis:
          $ref: '#/components/schemas/ReviewBasis'
        actor_subject_id:
          type: string
          pattern: ^xs_[a-z0-9]{16,64}$
        at:
          type: string
          format: date-time
    FindingProgressRecord:
      type: object
      additionalProperties: false
      required:
      - state
      - reason
      - closure
      - basis
      - actor_subject_id
      - at
      properties:
        state:
          type: string
          enum:
          - not_started
          - in_progress
          - ended
        reason:
          type: string
          maxLength: 4000
          minLength: 1
        closure:
          anyOf:
          - $ref: '#/components/schemas/ReviewClosure'
          - type: 'null'
        basis:
          $ref: '#/components/schemas/ReviewBasis'
        actor_subject_id:
          type: string
          pattern: ^xs_[a-z0-9]{16,64}$
        at:
          type: string
          format: date-time
    FindingAssessment:
      type: object
      additionalProperties: false
      required:
      - case_id
      - finding_id
      - recorded
      - version
      - review
      - progress
      - updated_at
      - updated_by_subject
      properties:
        case_id:
          $ref: '#/components/schemas/CaseId'
        finding_id:
          type: string
          pattern: ^xf_[A-Za-z0-9_-]{22}$
        recorded:
          type: boolean
        version:
          type: integer
          minimum: 0
        review:
          anyOf:
          - $ref: '#/components/schemas/FindingReviewRecord'
          - type: 'null'
        progress:
          anyOf:
          - $ref: '#/components/schemas/FindingProgressRecord'
          - type: 'null'
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        updated_by_subject:
          type: string
          maxLength: 67
      description: Missing extension has recorded=false, version=0 and null review/progress. Recorded pending_review/not_started
        are distinct from absent. Responsibility retains its independent original version and receipt format.
    FindingAssessmentCommand:
      type: object
      additionalProperties: false
      required:
      - operation
      - operation_id
      - expected_version
      - expected_case_version
      - expected_basis_digest
      - selection
      properties:
        operation:
          type: string
          enum:
          - record_review
          - record_progress
        operation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        expected_version:
          type: integer
          minimum: 0
        expected_case_version:
          type: integer
          minimum: 1
        expected_basis_digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        selection:
          $ref: '#/components/schemas/ReviewBasisSelectionInput'
        review:
          anyOf:
          - $ref: '#/components/schemas/ReviewPayload'
          - type: 'null'
        progress:
          anyOf:
          - $ref: '#/components/schemas/ReviewProgressPayload'
          - type: 'null'
      oneOf:
      - properties:
          operation:
            const: record_review
          review:
            $ref: '#/components/schemas/ReviewPayload'
          progress:
            type: 'null'
        required:
        - review
      - properties:
          operation:
            const: record_progress
          progress:
            $ref: '#/components/schemas/ReviewProgressPayload'
          review:
            type: 'null'
        required:
        - progress
    FindingAssessmentAction:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - operation
      - actor_subject_id
      - at
      - case_version
      - initial
      - command
      - basis
      - previous
      - current
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        operation:
          type: string
          enum:
          - record_review
          - record_progress
        actor_subject_id:
          type: string
          pattern: ^xs_[a-z0-9]{16,64}$
        at:
          type: string
          format: date-time
        case_version:
          type: integer
          minimum: 2
        initial:
          type: boolean
        command:
          allOf:
          - $ref: '#/components/schemas/FindingAssessmentCommand'
          - type: object
            properties:
              selection:
                $ref: '#/components/schemas/ReviewBasisSelection'
          description: Persisted commands retain resolved source references; input-only omission does not loosen immutable receipts.
        basis:
          $ref: '#/components/schemas/ReviewBasis'
        previous:
          $ref: '#/components/schemas/FindingAssessment'
        current:
          $ref: '#/components/schemas/FindingAssessment'
    FindingAssessmentHistory:
      type: object
      additionalProperties: false
      required:
      - items
      - through_version
      - next_before_version
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FindingAssessmentAction'
          maxItems: 100
        through_version:
          type: integer
          minimum: 0
        next_before_version:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
    ResourceCurrentUpdate:
      type: object
      additionalProperties: false
      required: [reference, state]
      properties:
        reference: {$ref: '#/components/schemas/ReviewResourceChoice'}
        state: {type: string, enum: [revised, withdrawn, unavailable]}
        latest_revision: {type: integer, minimum: 1}
        latest_hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
      description: Current signal outside the immutable adopted basis. New revision metadata is returned only under its current reporter and target permissions. No automatic adoption or rewrite of historical conclusions.
    ReviewBasisEvaluation:
      type: object
      additionalProperties: false
      required:
      - state
      - current
      properties:
        resource_updates:
          type: array
          items: {$ref: '#/components/schemas/ResourceCurrentUpdate'}
        state:
          type: string
          enum:
          - unrecorded
          - unchanged
          - changed
          - unavailable
        current:
          anyOf:
          - $ref: '#/components/schemas/ReviewBasis'
          - type: 'null'
    ReviewCreationCommand:
      type: object
      additionalProperties: false
      required:
      - operation
      - operation_id
      - case_id
      - expected_case_version
      - finding
      - selection
      - expected_basis_digest
      - reason
      properties:
        execution_context:
          anyOf:
          - {$ref: '#/components/schemas/ReviewExecutionContext'}
          - {type: 'null'}
        operation:
          type: string
          enum:
          - start_review
          - continue_finding
        operation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        case_id:
          type: string
          pattern: ^$|^xc_[A-Za-z0-9_-]{22}$
        expected_case_version:
          type: integer
          minimum: 0
        new_case:
          anyOf:
          - $ref: '#/components/schemas/CreateCaseRequest'
          - type: 'null'
        finding:
          $ref: '#/components/schemas/CreateFindingRequest'
        selection:
          $ref: '#/components/schemas/ReviewBasisSelectionInput'
        expected_basis_digest:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        review:
          anyOf:
          - $ref: '#/components/schemas/ReviewPayload'
          - type: 'null'
        from:
          anyOf:
          - $ref: '#/components/schemas/ReviewSealedFindingReference'
          - type: 'null'
        reason:
          type: string
          maxLength: 4000
          minLength: 1
      description: New Case uses new_case, empty case_id and expected_case_version=0; otherwise use an open Case and
        its current version. start_review requires review without from; continue_finding requires exact sealed from
        without review. Selected references have finding scope. Idempotency binds deployment/actor/operation/operation_id
        before generated identities. One transaction creates all required rows; any failure leaves no partial records.
        Current authorization precedes receipt replay.
    ReviewCreationPreview:
      type: object
      additionalProperties: false
      required:
      - operation
      - operation_id
      - case_id
      - expected_case_version
      - finding
      - selection
      - expected_basis_digest
      - reason
      properties:
        execution_context:
          anyOf:
          - {$ref: '#/components/schemas/ReviewExecutionContext'}
          - {type: 'null'}
        operation:
          type: string
          enum:
          - start_review
          - continue_finding
        operation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        case_id:
          type: string
          pattern: ^$|^xc_[A-Za-z0-9_-]{22}$
        expected_case_version:
          type: integer
          minimum: 0
        new_case:
          anyOf:
          - $ref: '#/components/schemas/CreateCaseRequest'
          - type: 'null'
        finding:
          $ref: '#/components/schemas/CreateFindingRequest'
        selection:
          $ref: '#/components/schemas/ReviewBasisSelectionInput'
        expected_basis_digest:
          type: string
          pattern: ^$|^sha256:[a-f0-9]{64}$
        review:
          anyOf:
          - $ref: '#/components/schemas/ReviewPayload'
          - type: 'null'
        from:
          anyOf:
          - $ref: '#/components/schemas/ReviewSealedFindingReference'
          - type: 'null'
        reason:
          type: string
          maxLength: 4000
          minLength: 1
      description: Read-only preview of the same finite creation command; expected_basis_digest may be empty and is
        ignored only here. Resolves current visible source contents and target version, creates no rows or reservations.
        Submit the returned digest with the same selection.
    ReviewCreationReceipt:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - operation
      - actor_subject_id
      - at
      - case_id
      - finding_id
      - case_version
      - command
      - basis
      - action
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        operation:
          type: string
          enum:
          - start_review
          - continue_finding
        actor_subject_id:
          type: string
          pattern: ^xs_[a-z0-9]{16,64}$
        at:
          type: string
          format: date-time
        case_id:
          $ref: '#/components/schemas/CaseId'
        finding_id:
          type: string
          pattern: ^xf_[A-Za-z0-9_-]{22}$
        case_version:
          type: integer
          minimum: 2
        command:
          allOf:
          - $ref: '#/components/schemas/ReviewCreationCommand'
          - type: object
            properties:
              selection:
                $ref: '#/components/schemas/ReviewBasisSelection'
          description: Persisted commands retain resolved source references; input-only omission does not loosen immutable receipts.
        basis:
          $ref: '#/components/schemas/ReviewBasis'
        action:
          anyOf:
          - $ref: '#/components/schemas/FindingAssessmentAction'
          - type: 'null'
    FindingAssessmentView:
      type: object
      additionalProperties: false
      required:
      - evaluated_at
      - assessment
      - case_version
      - case_status
      - review_basis
      - progress_basis
      - overdue
      - history
      - continuations
      - allowed_actions
      properties:
        evaluated_at:
          type: string
          format: date-time
        assessment:
          $ref: '#/components/schemas/FindingAssessment'
        case_version:
          type: integer
          minimum: 1
        case_status:
          type: string
          enum:
          - open
          - sealed
          - archived
        review_basis:
          $ref: '#/components/schemas/ReviewBasisEvaluation'
        progress_basis:
          $ref: '#/components/schemas/ReviewBasisEvaluation'
        overdue:
          type: boolean
        history:
          $ref: '#/components/schemas/FindingAssessmentHistory'
        continuations:
          type: array
          items:
            $ref: '#/components/schemas/ReviewCreationReceipt'
        allowed_actions:
          type: array
          maxItems: 2
          items:
            type: string
            enum:
            - record_review
            - record_progress
            - continue_finding
      description: Read-time evaluation never overwrites verdict/closure or reopens progress. Only recorded unfinished
        progress is overdue. Later outgoing continuations are separate from sealed pack bytes.
    FindingAssessmentSnapshot:
      type: object
      additionalProperties: false
      required:
      - assessments
      - actions
      - creations
      properties:
        assessments:
          type: array
          items:
            $ref: '#/components/schemas/FindingAssessment'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/FindingAssessmentAction'
        creations:
          type: array
          items:
            $ref: '#/components/schemas/ReviewCreationReceipt'

    InvestigationQueueFilters:
      type: object
      additionalProperties: false
      required:
      - mode
      - period
      - sort
      properties:
        mode:
          type: string
          enum:
          - current
          - created
          - reassessment
        period:
          type: string
          enum:
          - 24h
          - 7d
          - custom
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        assignee:
          type: string
        progress:
          type: string
          enum:
          - ''
          - unrecorded
          - not_started
          - in_progress
          - ended
        conclusion:
          type: string
          enum:
          - ''
          - unrecorded
          - pending_review
          - supported
          - not_supported
          - insufficient_evidence
        basis:
          type: string
          enum:
          - ''
          - unrecorded
          - unchanged
          - changed
          - unavailable
        case_status:
          type: string
          enum:
          - ''
          - open
          - sealed
        search:
          type: string
          maxLength: 200
        sort:
          type: string
          enum:
          - created_desc
          - due_asc
      description: current ignores creation period; created uses [from,to) with explicit timezone or the fixed evaluated_at
        relative window; reassessment includes changed and unavailable basis. Text bounds are UTF-8 bytes. Other dimensions
        constrain the same complete deployment-authorized set. Custom requires from and to; other periods forbid them.
