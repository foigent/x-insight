openapi: 3.1.0
info:
  title: X-Insight Evidence Investigation and Workspace API
  version: 2.0.0
  description: >-
    Product-session-protected, metadata-only execution investigation API and
    local operator access plane. This contract is not a public or multi-tenant
    API contract. Authenticated deployment requires a separately approved
    internal HTTPS origin; direct loopback HTTP is not a Secure-cookie proof.
    Local-account v3 scoped investigation roles use current workbench grants and
    a closed route allowlist. Legacy x-permission entries retain their meaning;
    scoped alternatives apply only to explicitly supported workchain routes.
    Scoped responses carry X-XInsight-Representation, X-XInsight-Projection-Version
    and X-XInsight-Scope-Revision; clients may send the last scope revision and
    receive 409 scope_revision_changed when authorization changes. Unavailable
    whole cases and executions return the same 404 as absent resources. Bare
    case creation, sealing, exports, management and other global routes remain
    closed to scoped roles. Event hashes identify original events, not projected JSON.
servers:
  - url: /
    description: Same product origin; authenticated use requires the internal HTTPS gate
security:
  - sessionCookie: []
tags:
  - name: Access
  - name: Posture
  - name: Executions
  - name: Sources
  - name: Connectors
  - name: Sessions
  - name: Workspace
  - name: Discovery
  - name: Workbench
  - name: Runtime
  - name: ReviewPolicy
paths:
  /api/v1/access/providers:
    get:
      security: []
      tags: [Access]
      operationId: getAccessProviderCapabilities
      summary: Read provider-neutral access capability state without activating OIDC
      responses:
        '200':
          description: Local provider and generic OIDC seam state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessProviderCapabilities'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/access/login:
    post:
      security: []
      tags: [Access]
      operationId: loginLocalAccount
      summary: Exchange same-origin JSON credentials for one product-owned Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session created and exact Secure host cookie issued
          headers:
            Set-Cookie:
              schema:
                type: string
              description: __Host-xinsight_session with Secure, HttpOnly, SameSite=Strict and Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/access/session:
    get:
      tags: [Access]
      operationId: getAccessSession
      summary: Restore current Session state and synchronizer CSRF token
      responses:
        '200':
          description: Current bounded Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/access/logout:
    post:
      tags: [Access]
      operationId: logoutAccessSession
      summary: Revoke the current server-side Session
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked and host cookie expired
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
  /api/v1/access/sessions:
    get:
      tags: [Access]
      operationId: listAccessSessions
      summary: List bounded non-secret Session metadata
      x-permission: access.sessions.read
      responses:
        '200':
          description: Active in-memory Sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/access/sessions/{session_ref}/revoke:
    post:
      tags: [Access]
      operationId: revokeAccessSession
      summary: Revoke one Session by its non-secret reference
      x-permission: access.sessions.revoke
      parameters:
        - $ref: '#/components/parameters/SessionRef'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '405':
          $ref: '#/components/responses/PostMethodNotAllowed'
  /api/v1/review-capture/default:
    get:
      tags: [ReviewPolicy]
      operationId: getReviewCaptureDefault
      summary: Read desired and effective XI review-body capture settings separately
      x-permission: review.policy.manage
      responses:
        '200': {description: Current policy or an unconfigured suggested value, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [ReviewPolicy]
      operationId: applyReviewCaptureDefault
      summary: Save a revisioned desired policy and request owner confirmation
      description: The response distinguishes pending desired revision from effective revision. A lost controller response is unconfirmed and requires GET readback before retry.
      x-permission: review.policy.manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, settings]
              properties:
                expected_revision: {type: integer, minimum: 0}
                settings: {$ref: '#/components/schemas/ReviewCaptureSettings'}
      responses:
        '200': {description: Desired and effective readback, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/review-capture/default/confirm:
    post:
      tags: [ReviewPolicy]
      operationId: confirmReviewCaptureDefault
      summary: Explicitly confirm an exact pending desired revision after readback
      x-permission: review.policy.manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [desired_revision]
              properties:
                desired_revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Effective revision readback, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/review-capture/projects:
    get:
      tags: [ReviewPolicy]
      operationId: listReviewCaptureProjects
      summary: Discover exact active source projects and existing XI project bindings
      x-permission: review.policy.manage
      responses:
        '200': {description: Source scopes and XI projects, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [ReviewPolicy]
      operationId: bindReviewCaptureProject
      summary: Bind one exact active source scope to an existing or new XI project
      description: A missing xi_project_id creates a new project. An uncertain result requires a GET readback before retry.
      x-permission: review.policy.manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_system_id, source_instance, org_id, project_id, display_name]
              properties:
                source_system_id: {type: string, format: uuid}
                source_instance: {type: string, minLength: 1, maxLength: 128}
                org_id: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
                project_id: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
                xi_project_id: {type: string, format: uuid}
                display_name: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {description: Bound project catalog readback, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/review-capture/exceptions:
    get:
      tags: [ReviewPolicy]
      operationId: listReviewCaptureExceptions
      summary: Read XI exception revisions and source-verified personal key owners
      description: The catalog reports whether either list is truncated at 256 entries. An absent entry in a truncated list is not evidence of absence.
      x-permission: review.policy.manage
      responses:
        '200': {description: Exception and verified-account catalog, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [ReviewPolicy]
      operationId: applyReviewCaptureException
      summary: Save and attempt to confirm one revisioned XI capture exception
      x-permission: review.policy.manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, exception]
              properties:
                expected_revision: {type: integer, minimum: 0}
                exception: {type: object, description: Exact tenant-category, source-project, or source-verified UR key-owner selector and desired capture settings}
      responses:
        '200': {description: Exact exception revision readback, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/review-capture/exceptions/confirm:
    post:
      tags: [ReviewPolicy]
      operationId: confirmReviewCaptureException
      summary: Confirm one exact pending exception revision after readback
      x-permission: review.policy.manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policy_ref, desired_revision]
              properties:
                policy_ref: {type: string, pattern: '^xipe_[a-f0-9]{32}$'}
                desired_revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Confirmed exception readback, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/review-capture/unirouter/scopes:
    get:
      tags: [ReviewPolicy]
      operationId: listReviewCaptureURPolicyScopes
      summary: Read authorized UniRouter policy grants and one page of projects
      x-permission: review.policy.manage
      parameters:
        - {name: cursor, in: query, required: false, schema: {type: string, pattern: '^[1-9][0-9]{0,18}$'}}
      responses:
        '200': {description: "Exact paired installation scopes, grants, projects, and next cursor", content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/review-capture/unirouter/organizations/{org_id}:
    parameters:
      - {name: org_id, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]{0,18}$'}}
    get:
      tags: [ReviewPolicy]
      operationId: getReviewCaptureUREnterprisePolicy
      summary: Read the paired organization's source policy and future-project default
      x-permission: review.policy.manage
      parameters:
        - {name: delegation_id, in: query, required: true, schema: {type: string, pattern: '^xipg_[1-9][0-9]{0,18}$'}}
      responses:
        '200': {description: Current enterprise policy with source version vector, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [ReviewPolicy]
      operationId: applyReviewCaptureUREnterprisePolicy
      summary: Submit one revisioned enterprise source policy through the paired owner controller
      x-permission: review.policy.manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewCaptureURWrite'}
      responses:
        '200': {description: Immutable delegated operation readback, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/review-capture/unirouter/projects/{project_id}:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]{0,18}$'}}
    get:
      tags: [ReviewPolicy]
      operationId: getReviewCaptureURProjectPolicy
      summary: Read current UniRouter project policy and inheritance via a delegated grant
      x-permission: review.policy.manage
      parameters:
        - {name: delegation_id, in: query, required: true, schema: {type: string, pattern: '^xipg_[1-9][0-9]{0,18}$'}}
      responses:
        '200': {description: "Current desired, effective, and inherited source policy", content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [ReviewPolicy]
      operationId: applyReviewCaptureURProjectPolicy
      summary: Submit an exact revisioned UniRouter project policy through the owner controller
      description: The caller retains an immutable operation_ref before PUT. A normal repeated PUT only reads that operation. Explicit retry_unconfirmed may repeat the exact body and ref only after a fresh UR operation 404 and current XI/UR version checks; unavailable or forbidden readback never retries.
      x-permission: review.policy.manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewCaptureURWrite'}
      responses:
        '200': {description: Immutable delegated operation readback, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/review-capture/unirouter/projects/{project_id}/users:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]{0,18}$'}}
    get:
      tags: [ReviewPolicy]
      operationId: listReviewCaptureURPolicyUsers
      summary: Read one page of source project members eligible for delegated user policy selection
      x-permission: review.policy.manage
      parameters:
        - {name: cursor, in: query, required: false, schema: {type: string, pattern: '^[1-9][0-9]{0,18}$'}}
      responses:
        '200': {description: Source users and next cursor, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/review-capture/unirouter/projects/{project_id}/users/{user_id}:
    parameters:
      - {name: project_id, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]{0,18}$'}}
      - {name: user_id, in: path, required: true, schema: {type: string, pattern: '^[1-9][0-9]{0,18}$'}}
    get:
      tags: [ReviewPolicy]
      operationId: getReviewCaptureURUserPolicy
      summary: Read one exact source project member policy and inheritance
      x-permission: review.policy.manage
      parameters:
        - {name: delegation_id, in: query, required: true, schema: {type: string, pattern: '^xipg_[1-9][0-9]{0,18}$'}}
      responses:
        '200': {description: Current user policy with source version vector, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [ReviewPolicy]
      operationId: applyReviewCaptureURUserPolicy
      summary: Submit one revisioned exact source project member policy through the owner controller
      x-permission: review.policy.manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewCaptureURWrite'}
      responses:
        '200': {description: Immutable delegated operation readback, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/work-event-install/invitations:
    get:
      tags: [ReviewPolicy]
      operationId: listWorkEventInstallInvitations
      summary: List pending and approved managed installations for administrator review
      x-permission: connector.installations.manage and review.policy.manage
      parameters:
        - {name: after, in: query, schema: {type: string, pattern: '^xiei_[a-f0-9]{32}$'}, description: Opaque continuation value from the previous next_cursor}
      responses:
        '200':
          description: Up to 20 compact installations in stable newest-first order; read one installation for its status snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, maxItems: 20, items: {type: object}}
                  next_cursor: {type: string, pattern: '^xiei_[a-f0-9]{32}$'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [ReviewPolicy]
      operationId: issueWorkEventInstallInvitation
      summary: Issue one short-lived host invitation with one-time bearer return
      x-permission: connector.installations.manage and review.policy.manage
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, expires_in_seconds]
              properties:
                display_name: {type: string, minLength: 1, maxLength: 128}
                expires_in_seconds: {type: integer, minimum: 600, maximum: 86400}
      responses:
        '201': {description: Invitation with one-time token, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/work-event-install/invitations/{invitation_id}:
    get:
      tags: [ReviewPolicy]
      operationId: getWorkEventInstallInvitation
      summary: Read one invitation and exact host-reported candidates
      x-permission: connector.installations.manage and review.policy.manage
      parameters:
        - {name: invitation_id, in: path, required: true, schema: {type: string, pattern: '^xiei_[a-f0-9]{32}$'}}
      responses:
        '200': {description: Invitation without bearer, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/work-event-install/invitations/{invitation_id}/approve:
    post:
      tags: [ReviewPolicy]
      operationId: approveWorkEventInstallInvitation
      summary: Approve every exact reported host project mapping before registration
      x-permission: connector.installations.manage and review.policy.manage
      parameters:
        - {name: invitation_id, in: path, required: true, schema: {type: string, pattern: '^xiei_[a-f0-9]{32}$'}}
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mappings, excluded_project_keys, future_agents_allowed]
              properties:
                mappings: {type: array, minItems: 1, maxItems: 32, items: {type: object}}
                excluded_project_keys: {type: array, maxItems: 31, items: {type: string}}
                future_agents_allowed: {type: boolean}
      responses:
        '200': {description: Approved exact mapping, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/work-event-install/invitations/{invitation_id}/future-decisions:
    post:
      tags: [ReviewPolicy]
      operationId: decideManagedFutureAgentProjects
      summary: Approve or exclude every queued future Agent candidate in a managed installation
      x-permission: connector.installations.manage and review.policy.manage
      parameters:
        - {name: invitation_id, in: path, required: true, schema: {type: string, pattern: '^xiei_[a-f0-9]{32}$'}}
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mappings, excluded_project_keys]
              properties:
                mappings: {type: array, maxItems: 32, items: {type: object}}
                excluded_project_keys: {type: array, maxItems: 32, items: {type: string}}
      responses:
        '200': {description: Exact future candidate decisions, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/work-event-install/candidates:
    post:
      tags: [ReviewPolicy]
      operationId: reportWorkEventInstallCandidates
      summary: Report initial host candidate projects using the invitation and a host-created ingest bearer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitation_token, ingest_token, projects]
              properties:
                invitation_token: {type: string}
                ingest_token: {type: string}
                projects: {type: array, minItems: 1, maxItems: 32, items: {type: object}}
      responses:
        '200': {description: Candidate state, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/work-event-install/pickup:
    post:
      tags: [ReviewPolicy]
      operationId: pickupWorkEventInstallApproval
      summary: Read approved installation with both original invitation and host bearer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitation_token, ingest_token]
              properties:
                invitation_token: {type: string}
                ingest_token: {type: string}
      responses:
        '200': {description: Approved installation without bearer echo, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/work-event-install/renew:
    post:
      tags: [ReviewPolicy]
      operationId: renewManagedWorkEventCredential
      summary: Bind one host-staged replacement bearer to the current managed ingest bearer during its final 31 days
      security: [{serviceBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [replacement_token]
              properties:
                replacement_token: {type: string}
      responses:
        '200': {description: Idempotent renewal status and expiry; no bearer echo, content: {application/json: {schema: {type: object}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/work-event-install/status:
    post:
      tags: [ReviewPolicy]
      operationId: reportManagedWorkEventStatus
      summary: Replace the latest bounded snapshot for the current bearer-owned approved installation
      description: Requires HTTPS and no browser cookie. This source report does not prove complete capture. It accepts no arbitrary diagnostic messages, paths or bodies.
      security: [{serviceBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: object
                  additionalProperties: false
                  required: [metadata_pending, metadata_blocked, body_pending, gaps]
                  properties:
                    metadata_pending: {type: integer, minimum: 0, maximum: 9007199254740991}
                    metadata_blocked: {type: integer, minimum: 0, maximum: 9007199254740991}
                    body_pending: {type: integer, minimum: 0, maximum: 9007199254740991}
                    gaps:
                      type: array
                      maxItems: 64
                      description: Each category occurs at most once; counts are historical diagnostic occurrences, not a lost-event total
                      items:
                        type: object
                        additionalProperties: false
                        required: [code, occurrences]
                        properties:
                          code: {type: string, enum: [body_limit, body_unavailable, metadata_unavailable, receiver_unavailable, source_mapping_unconfirmed, future_scope_unconfirmed, renewal_unconfirmed, ur_relation_unconfirmed, outbox_full, observation_unavailable]}
                          occurrences: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '200':
