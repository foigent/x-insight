        reading_id: {type: string, pattern: '^xrt_[A-Za-z0-9_-]{22}$'}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/RuntimeObservation'}}
        next_cursor: {type: string}
    RuntimeMeasurementExclusions:
      type: object
      additionalProperties: false
      required: [not_applicable, not_observed, legacy_unknown, invalid, missing_predecessor, missing_context, conflicting_context, incompatible_context]
      properties:
        not_applicable: {type: integer, minimum: 0}
        not_observed: {type: integer, minimum: 0}
        legacy_unknown: {type: integer, minimum: 0}
        invalid: {type: integer, minimum: 0}
        missing_predecessor: {type: integer, minimum: 0}
        missing_context: {type: integer, minimum: 0}
        conflicting_context: {type: integer, minimum: 0}
        incompatible_context: {type: integer, minimum: 0}
    RuntimePercentiles:
      type: object
      additionalProperties: false
      required: [version, state, unit, sample_count]
      properties:
        version: {type: string, const: xinsight.runtime.measurements.linear-interpolation.v1}
        state: {type: string, enum: [computed, not_computable]}
        unit: {type: string, const: milliseconds}
        sample_count: {type: integer, minimum: 0}
        p50: {type: string, description: Exact decimal milliseconds using frozen T05 linear interpolation; absent for an empty eligible set}
        p95: {type: string, description: Computed from original eligible nanosecond values; never averaged from subgroup percentiles}
    RuntimeMeasurementGroup:
      type: object
      additionalProperties: false
      required: [operation, stream_mode, measurement_kind, measurement_version, completion_evidence, entry_time_state, observation_count, excluded, percentiles]
      properties:
        operation: {type: string, description: Same-subject authorized source operation, or not_observed or conflicting}
        stream_mode: {type: string, enum: [streaming, non_streaming, not_observed, conflicting]}
        measurement_kind: {type: string, enum: [request_response_complete, stream_first_valid_output, stream_complete, attempt_http_round_trip]}
        measurement_version: {type: string, const: '1'}
        completion_evidence: {type: string, description: Exact source end-boundary label; the source contract already binds its start and end pair; eligibility additionally requires known compatible operation and stream context}
        entry_time_state: {type: string, enum: [observed, unknown]}
        observation_count: {type: integer, minimum: 1}
        excluded: {$ref: '#/components/schemas/RuntimeMeasurementExclusions'}
        percentiles: {$ref: '#/components/schemas/RuntimePercentiles'}
    RuntimeCurrentItem:
      type: object
      additionalProperties: false
      required: [ref, source_system_id, source_instance, org_id, project_id, snapshot_observed_at, received_at, source_sha256, current_state, entry]
      properties:
        ref: {type: string, pattern: '^xrc_[a-f0-9]{64}$'}
        source_system_id: {type: string, format: uuid}
        source_instance: {type: string}
        org_id: {type: string}
        project_id: {type: string}
        snapshot_observed_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        source_sha256: {$ref: '#/components/schemas/SHA256Ref'}
        current_state: {type: string, enum: [lease_valid_execution, leased_pending, last_known, not_current], description: 'Pending is separate from executing; failures, expiry and uncertain clock order cannot be treated as current execution'}
        entry: {$ref: '../../internal/sourcefacts/contract/observations/runtime-current.schema.json#/properties/entries/items'}
    RuntimeCurrentInventory:
      type: object
      additionalProperties: false
      required: [version, evaluated_at, coverage, uncovered, items]
      properties:
        version: {type: string, const: xinsight.runtime.lease-inventory.v1}
        evaluated_at: {type: string, format: date-time}
        coverage: {type: string, const: lease_backed_inventory}
        uncovered: {type: array, items: {type: string, enum: [synchronous_requests_without_execution_lease, progress_between_lease_observations, pages_are_independently_observed]}}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/RuntimeCurrentItem'}}
        next_cursor: {type: string}
    RuntimeOutcomeCount:
      type: object
      additionalProperties: false
      required: [outcome, requests]
      properties:
        outcome: {type: string, enum: [local_delivery_completed, technical_failure, admission_rejected, output_held, interrupted, context_done_unresolved, unresolved, conflicting, missing_predecessor]}
        requests: {type: integer, minimum: 1}
    RuntimeDiagnosticFailure:
      type: object
      additionalProperties: false
      required: [numerator, denominator, excluded_requests, state, basis]
      properties:
        numerator: {type: integer, minimum: 0, description: Requests with unambiguous explicit request-level technical failure}
        denominator: {type: integer, minimum: 0, description: Local delivery completed plus explicit technical failure; excludes every other outcome}
        excluded_requests: {type: integer, minimum: 0}
        state: {type: string, enum: [computed, not_computable]}
        basis: {type: string, const: 'authorized_request_level_local_delivery_completed_or_explicit_technical_failure;not_global_failure_rate_or_slo'}
    RuntimeSummary:
      type: object
      additionalProperties: false
      required: [reading_id, summary_version, interpretation_revision, entry_time, requests, outcomes, diagnostic_failure, coverage]
      properties:
        reading_id: {type: string, pattern: '^xrt_[A-Za-z0-9_-]{22}$'}
        summary_version: {type: string, const: xinsight.runtime.request-outcomes.v1}
        interpretation_revision: {$ref: '#/components/schemas/SHA256Ref'}
        entry_time: {type: string, enum: [known, unknown, all]}
        requests: {type: integer, minimum: 0}
        outcomes: {type: array, maxItems: 9, items: {$ref: '#/components/schemas/RuntimeOutcomeCount'}, description: Disjoint classifications; counts sum to requests}
        diagnostic_failure: {$ref: '#/components/schemas/RuntimeDiagnosticFailure'}
        coverage: {$ref: '#/components/schemas/RuntimeCoverage'}
    RuntimeDimensionGroup:
      type: object
      additionalProperties: false
      required: [value, evidence_state, requests, subjects, observation_count]
      properties:
        value: {type: string, minLength: 1, description: Exact source value; a model reference need not be a model display name}
        evidence_state: {type: string, minLength: 1, description: Source capability evidence state or destination dispatch state; not_applicable for operation and required capability}
        requests: {type: integer, minimum: 1}
        subjects: {type: integer, minimum: 1, description: Distinct full request identity plus subject kind and subject ID; not a global attempt denominator}
        observation_count: {type: integer, minimum: 1, description: Distinct authorized complete observations supplying this exact value and evidence state}
    RuntimeEconomicLink:
      type: object
      additionalProperties: false
      required: [economic_fact_id, execution_id, source_event_hash]
      properties:
        economic_fact_id: {type: string, format: uuid}
        execution_id: {type: string}
        source_event_hash: {type: string}
    RuntimeAssociation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, source]
          properties:
            kind: {type: string, enum: [source]}
            source: {$ref: '#/components/schemas/WorkbenchSourceObservation'}
        - type: object
          additionalProperties: false
          required: [kind, economic]
          properties:
            kind: {type: string, enum: [economic]}
            economic: {$ref: '#/components/schemas/RuntimeEconomicLink'}
    RuntimeExecutionRequest:
      type: object
      additionalProperties: false
      required: [version, reading_id, membership_ref, execution_id, request]
      properties:
        version: {type: string, enum: [xinsight.runtime.execution-request.v1]}
        reading_id: {type: string}
        membership_ref: {$ref: '#/components/schemas/SHA256Ref'}
        execution_id: {type: string}
        request: {$ref: '#/components/schemas/RuntimeRequest'}
    RuntimeAssociations:
      type: object
      additionalProperties: false
      required: [reading_id, request_ref, associations_version, membership_ref, basis, items]
      properties:
        reading_id: {type: string}
        request_ref: {type: string}
        associations_version: {type: string, enum: [xinsight.runtime.associations.v1]}
        membership_ref: {type: string}
        basis: {type: string, enum: [same_source_request_identity]}
        items: {type: array, items: {$ref: '#/components/schemas/RuntimeAssociation'}}
        next_cursor: {type: string}
    ResourceRef:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:/@-]{0,255}$'
    ResourceScope:
      type: object
      additionalProperties: false
      required: [source_system_id, source_instance, org_id, project_id]
      properties:
        source_system_id: {type: string, format: uuid}
        source_instance: {$ref: '#/components/schemas/ResourceRef'}
        org_id: {$ref: '#/components/schemas/ResourceRef'}
        project_id: {$ref: '#/components/schemas/ResourceRef'}
    ResourceObject:
      type: object
      additionalProperties: false
      required: [ref, version, name, location, ownership, classification, device_management]
      properties:
        ref: {$ref: '#/components/schemas/ResourceRef'}
        version: {$ref: '#/components/schemas/ResourceRef'}
        name: {type: string, minLength: 1, maxLength: 160}
        location: {type: string, enum: [enterprise_service, pc]}
        ownership: {type: string, enum: [known, unknown]}
        owner_ref: {$ref: '#/components/schemas/ResourceRef'}
        classification: {type: string, enum: [known, unknown]}
        classification_ref: {$ref: '#/components/schemas/ResourceRef'}
        device_management: {type: string, enum: [managed, unmanaged, unknown]}
    ResourceTransform:
      type: object
      additionalProperties: false
      required: [kind, input_version, output_version, receipt_ref]
      properties:
        kind: {type: string, enum: [extract, summarize, redact, translate, truncate]}
        input_version: {$ref: '#/components/schemas/ResourceRef'}
        output_version: {$ref: '#/components/schemas/ResourceRef'}
        receipt_ref: {$ref: '#/components/schemas/ResourceRef'}
    ResourceInputClaim:
      type: object
      additionalProperties: false
      required: [fragment_ref, fragment_version, attempt_id, attempt_kind, reported_input_ref, transforms]
      properties:
        fragment_ref: {$ref: '#/components/schemas/ResourceRef'}
        fragment_version: {$ref: '#/components/schemas/ResourceRef'}
        attempt_id: {$ref: '#/components/schemas/ResourceRef'}
        attempt_kind: {type: string, enum: [provider_attempt, media_attempt]}
        reported_input_ref: {$ref: '#/components/schemas/ResourceRef'}
        transforms: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/ResourceTransform'}}
    ResourceAccessRecord:
      type: object
      additionalProperties: false
      description: Internal synthetic qualification only, bounded to 16 KiB canonical JSON. There is no public resource import endpoint. Known ownership/classification and access decisions require their declared references; transforms form a contiguous version chain. Declarations and reference agreement do not verify content, redaction or dispatch.
      required: [schema_version, synthetic, record_ref, revision, reporter, target, request_id, application_ref, actor_ref, occurred_at, report_kind, resource, action, access_outcome, access_decision, withdrawn]
      properties:
        schema_version: {type: string, enum: [xinsight.resource-access.internal.v1]}
        synthetic: {type: boolean, const: true}
        record_ref: {$ref: '#/components/schemas/ResourceRef'}
        revision: {type: integer, minimum: 1, maximum: 1000000}
        previous_hash: {$ref: '#/components/schemas/SHA256Ref'}
        reporter: {$ref: '#/components/schemas/ResourceScope'}
        target: {$ref: '#/components/schemas/ResourceScope'}
        request_id: {$ref: '#/components/schemas/ResourceRef'}
        application_ref: {$ref: '#/components/schemas/ResourceRef'}
        actor_ref: {$ref: '#/components/schemas/ResourceRef'}
        occurred_at: {type: string, format: date-time}
        report_kind: {type: string, enum: [source_audit, client_assertion]}
        resource: {$ref: '#/components/schemas/ResourceObject'}
        action: {type: string, enum: [read, search, download]}
        access_outcome: {type: string, enum: [read, denied, failed, unknown]}
        access_decision: {type: string, enum: [allow, deny, unknown]}
        decision_ref: {$ref: '#/components/schemas/ResourceRef'}
        policy_version: {$ref: '#/components/schemas/ResourceRef'}
        input: {$ref: '#/components/schemas/ResourceInputClaim'}
        withdrawn: {type: boolean}
    RuntimeResourceItem:
      type: object
      additionalProperties: false
      required: [record, record_hash, chain_state, input_state, content_verification, input_evidence_basis, changed_since_reading, captured_input_evidence_refs]
      properties:
        record: {$ref: '#/components/schemas/ResourceAccessRecord'}
        record_hash: {$ref: '#/components/schemas/SHA256Ref'}
        chain_state: {type: string, enum: [complete, missing_predecessor]}
        input_state: {type: string, enum: [not_confirmed, reference_matched, reference_mismatch, conflicting_references, withdrawn, reassessment_required, missing_predecessor]}
        content_verification: {type: string, enum: [not_performed]}
        input_evidence_basis: {type: string, enum: [frozen_reference_witnesses]}
        changed_since_reading: {type: boolean}
        captured_input_evidence_refs: {type: array, maxItems: 2, items: {type: string}}
    ContentObservation:
      type: object
      additionalProperties: false
      description: >-
        Optional display projection for legacy response compatibility. If present all required fields
        must be valid. It is bound to this item's complete FrozenContentReference through the original
        manifest hash, not a new identity or ContentProjection. Missing attempt is not inferred.
        Provider observations require attempt; client observations may explicitly include a valid attempt.
        Unknown protocol identifiers remain readable as raw content without shape-based protocol guessing.
      required: [protocol, observation_point, content_item_id, occurred_at, capture_reason]
      properties:
        protocol: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
        observation_point: {type: string, enum: [client_request, provider_request, provider_response, client_response]}
        attempt_id: {$ref: '#/components/schemas/ContentManifestText'}
        content_item_id: {$ref: '#/components/schemas/ContentManifestText'}
        occurred_at: {type: string, format: date-time, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}Z$'}
        capture_reason: {type: string, enum: [none, capture_in_progress, policy_metadata_only, policy_disabled, scope_excluded, unsupported_protocol, limit_exceeded, queue_full, storage_write_failed, stream_interrupted, request_cancelled, output_held, not_applicable, capture_unavailable]}
      allOf:
        - if:
            properties: {observation_point: {enum: [provider_request, provider_response]}}
            required: [observation_point]
          then: {required: [attempt_id]}
    ContentManifestText:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[^\u0000-\u001f\u007f]+$'
    ContentRepresentation:
      type: object
      additionalProperties: false
      required: [media_type, encoding, byte_domain, saved_bytes, digest]
      properties:
        media_type: {type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$'}
        encoding: {type: string, const: identity}
        byte_domain: {type: string, const: stored_representation_before_http_content_encoding}
        saved_bytes: {type: integer, minimum: 0, maximum: 9007199254740991}
        digest: {$ref: '#/components/schemas/SHA256Ref'}
        redaction_ref:
          type: object
          additionalProperties: false
          required: [id, version]
          properties:
            id: {$ref: '#/components/schemas/ContentManifestText'}
            version: {$ref: '#/components/schemas/ContentManifestText'}
    FrozenContentReference:
      type: object
      additionalProperties: false
      description: Existing immutable reference; observation metadata does not change this wire shape or its digest.
      required: [source_system_id, source_instance, org_id, project_id, request_id, source_fact_id, revision, source_sha256, capture_status]
      properties:
        source_system_id: {type: string, format: uuid, pattern: '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'}
        source_instance: {$ref: '#/components/schemas/ContentManifestText'}
        org_id: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        project_id: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        request_id: {type: string, minLength: 1, maxLength: 64, pattern: '^[^\u0000-\u001f\u007f]+$'}
        source_fact_id: {type: string, pattern: '^uf1_[a-f0-9]{64}$'}
        revision: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        source_sha256: {$ref: '#/components/schemas/SHA256Ref'}
        capture_status: {type: string, enum: [complete, partial, pending, not_captured]}
        content_ref: {type: string, pattern: '^uc1_[a-f0-9]{64}$'}
        representation: {$ref: '#/components/schemas/ContentRepresentation'}
        expires_at: {type: string, format: date-time, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}Z$'}
      allOf:
        - if:
            properties: {capture_status: {enum: [complete, partial]}}
            required: [capture_status]
          then: {required: [content_ref, representation, expires_at]}
          else:
            not:
              anyOf:
                - {required: [content_ref]}
                - {required: [representation]}
                - {required: [expires_at]}
    RuntimeContentItem:
      type: object
      additionalProperties: false
      required: [reference, availability, newer_revision]
      properties:
        reference: {$ref: '#/components/schemas/FrozenContentReference'}
        observation: {$ref: '#/components/schemas/ContentObservation'}
        newer_revision: {type: boolean}
        availability:
          type: object
          additionalProperties: false
          required: [state, evaluated_at, retryable]
          properties:
            state: {type: string, enum: [available, pending, not_captured, expired, deleted, missing, corrupt, source_unavailable]}
            evaluated_at: {type: string, format: date-time}
            retryable: {type: boolean}
      allOf:
        - if: {properties: {reference: {properties: {capture_status: {const: complete}}}}}
          then: {properties: {observation: {properties: {capture_reason: {const: none}}}}}
        - if: {properties: {reference: {properties: {capture_status: {const: pending}}}}}
          then: {properties: {observation: {properties: {capture_reason: {const: capture_in_progress}}}}}
        - if: {properties: {reference: {properties: {capture_status: {const: partial}}}}}
          then: {properties: {observation: {properties: {capture_reason: {enum: [limit_exceeded, queue_full, storage_write_failed, stream_interrupted, request_cancelled, output_held]}}}}}
        - if: {properties: {reference: {properties: {capture_status: {const: not_captured}}}}}
          then: {properties: {observation: {properties: {capture_reason: {enum: [policy_metadata_only, policy_disabled, scope_excluded, unsupported_protocol, limit_exceeded, queue_full, storage_write_failed, not_applicable, capture_unavailable]}}}}}
    RuntimeContents:
      type: object
      additionalProperties: false
      required: [version, reading_id, request_ref, membership_ref, content_interpretation_revision, member_basis, items]
      properties:
        version: {type: string, const: xinsight.runtime-content.v1}
        reading_id: {type: string}
        request_ref: {type: string}
        membership_ref: {$ref: '#/components/schemas/SHA256Ref'}
        content_interpretation_revision: {type: string, const: xinsight.content-membership.v1}
        member_basis: {type: string, enum: [content_manifest, exact_execution_association]}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/RuntimeContentItem'}}
        next_cursor: {type: string}
    RuntimeResources:
      type: object
      additionalProperties: false
      required: [resources_version, reading_id, request_ref, membership_ref, coverage, items]
      properties:
        resources_version: {type: string, enum: [xinsight.runtime.resources.v1]}
        reading_id: {type: string}
        request_ref: {type: string}
        membership_ref: {$ref: '#/components/schemas/SHA256Ref'}
        coverage: {type: string, enum: [synthetic_internal_records_only]}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/RuntimeResourceItem'}}
        next_cursor: {type: string}
    ActionWitness:
      type: object
      additionalProperties: false
      description: Test/development native runtime report with a separate test file-checker verdict; never an independent resource audit.
      required: [schema_version, environment, record_ref, revision, reporter, target, request_id, occurred_at, run_id, tool_call_id, action_kind, object, tool_result, native_evidence, acceptance, content_links, withdrawn]
      properties:
        schema_version: {type: string, const: xinsight.resource-action.v1}
        environment: {type: string, enum: [test, development]}
        record_ref: {$ref: '#/components/schemas/ResourceRef'}
        revision: {type: integer, minimum: 1, maximum: 1000000}
        previous_hash: {$ref: '#/components/schemas/SHA256Ref'}
        reporter: {$ref: '#/components/schemas/ResourceScope'}
        target: {$ref: '#/components/schemas/ResourceScope'}
        request_id: {$ref: '#/components/schemas/ResourceRef'}
        final_request_id: {$ref: '#/components/schemas/ResourceRef'}
        related_request_ids: {type: array, maxItems: 4, items: {$ref: '#/components/schemas/ResourceRef'}}
        occurred_at: {type: string, format: date-time}
        run_id: {$ref: '#/components/schemas/ResourceRef'}
        tool_call_id: {$ref: '#/components/schemas/ResourceRef'}
        action_kind: {type: string, enum: [read, edit]}
        object:
          type: object
          additionalProperties: false
          required: [ref, version, name]
          properties:
            ref: {$ref: '#/components/schemas/ResourceRef'}
            version: {$ref: '#/components/schemas/ResourceRef'}
            name: {type: string, description: Safe UTF-8 display name, never a raw path}
        tool_result:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state: {type: string, enum: [completed, failed, unknown]}
            result_sha256: {$ref: '#/components/schemas/SHA256Ref'}
        native_evidence:
          type: object
          additionalProperties: false
          required: [trace_id, session_id, manifest_sha256, events_sha256, call_seq, call_sha256]
          properties:
            trace_id: {$ref: '#/components/schemas/ResourceRef'}
            session_id: {$ref: '#/components/schemas/ResourceRef'}
            manifest_sha256: {$ref: '#/components/schemas/SHA256Ref'}
            events_sha256: {$ref: '#/components/schemas/SHA256Ref'}
            call_seq: {type: integer, minimum: 1}
            call_sha256: {$ref: '#/components/schemas/SHA256Ref'}
            result_seq: {type: integer, minimum: 1}
            result_sha256: {$ref: '#/components/schemas/SHA256Ref'}
        relationship:
          type: object
          additionalProperties: false
          required: [receipt_ref, receipt_sha256]
          properties:
            receipt_ref: {$ref: '#/components/schemas/ResourceRef'}
            receipt_sha256: {$ref: '#/components/schemas/SHA256Ref'}
        acceptance:
          type: object
          additionalProperties: false
          required: [state, goal_state, hash_scope]
          properties:
            state: {type: string, enum: [confirmed, failed, not_checked]}
            goal_state: {type: string, enum: [passed, failed, not_checked]}
            hash_scope: {type: string, enum: [full_file, fragment, unknown]}
            before_sha256: {$ref: '#/components/schemas/SHA256Ref'}
            after_sha256: {$ref: '#/components/schemas/SHA256Ref'}
            checked_at: {type: string, format: date-time}
            checker_ref: {$ref: '#/components/schemas/ResourceRef'}
            before_receipt_sha256: {$ref: '#/components/schemas/SHA256Ref'}
            after_receipt_sha256: {$ref: '#/components/schemas/SHA256Ref'}
        content_links:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [purpose, extent, source_system_id, source_instance, org_id, project_id, request_id, source_fact_id, revision, content_ref, source_sha256, json_pointer]
            properties:
              purpose: {type: string, enum: [call, result, before, after]}
              extent: {type: string, enum: [full_file, fragment, unknown]}
              source_system_id: {type: string, format: uuid}
              source_instance: {$ref: '#/components/schemas/ResourceRef'}
              org_id: {$ref: '#/components/schemas/ResourceRef'}
              project_id: {$ref: '#/components/schemas/ResourceRef'}
              request_id: {$ref: '#/components/schemas/ResourceRef'}
              source_fact_id: {$ref: '#/components/schemas/ResourceRef'}
              revision: {$ref: '#/components/schemas/ResourceRef'}
              content_ref: {$ref: '#/components/schemas/ResourceRef'}
              source_sha256: {$ref: '#/components/schemas/SHA256Ref'}
              json_pointer: {type: string}
        withdrawn: {type: boolean}
    RuntimeActionWitnessItem:
      type: object
      additionalProperties: false
      required: [record, record_hash, chain_state, changed_since_reading, trigger_request_ref, final_request_ref, resolved_content_links]
      properties:
        record: {$ref: '#/components/schemas/ActionWitness'}
        record_hash: {$ref: '#/components/schemas/SHA256Ref'}
        chain_state: {type: string, enum: [complete, missing_predecessor]}
        changed_since_reading: {type: boolean}
        trigger_request_ref: {type: string}
        final_request_ref: {type: string}
        resolved_content_links:
          type: array
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [purpose, request_ref]
            properties:
              purpose: {type: string, enum: [call, result, before, after]}
              request_ref: {type: string}
    RuntimeActionWitnesses:
      type: object
      additionalProperties: false
      required: [action_witnesses_version, reading_id, request_ref, membership_ref, coverage, items]
      properties:
        action_witnesses_version: {type: string, const: xinsight.runtime.action-witnesses.v1}
