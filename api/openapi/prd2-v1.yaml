  /api/v1/workbench/executions/{execution_id}/purpose:
    parameters:
      - {name: execution_id, in: path, required: true, schema: {type: string, pattern: '^xe1_[a-f0-9]{64}$'}}
    get:
      tags: [Workbench]
      operationId: getRequestPurpose
      summary: Read human purpose judgments and adoption, optionally frozen by a reading
      description: Requires current matching source/project grants, purpose field access and detail access for the execution and every retained basis. Missing purpose authority is unavailable, never an unknown bucket. History is bounded by the returned state revision. A reading without a purpose manifest cannot acquire current judgments retroactively.
      x-permission: workbench.details.read
      parameters:
        - {name: reading_id, in: query, schema: {type: string, pattern: '^xwr_[A-Za-z0-9_-]{22}$'}}
        - {name: before_revision, in: query, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Authorized purpose state and up to twenty preceding events
          content: {application/json: {schema: {$ref: '#/components/schemas/PurposeView'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Reading or current scope authorization changed, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '410': {description: Reading expired, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [Workbench]
      operationId: reviseRequestPurpose
      summary: Append a human declaration or explicit purpose review/adoption action
      description: Human Session and same-origin HTTPS/CSRF only. Requires the separate purpose reviewer role and matching purpose read/review/detail grants. Case review and saved-views permissions do not imply this action. First declarations remain candidates; only explicit accept/modify establishes adoption. Unresolved contradictory candidates produce conflict. Withdrawing adoption or its declaration never selects a historical replacement. Historical snapshots and original money remain immutable. At most 256 declarations per request and 32 basis references per declaration are supported; this bound does not truncate retained history.
      x-permission: workbench.purpose.review
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PurposeCommand'}}}
      responses:
        '201':
          description: Immutable action, including an identical idempotent replay after current authorization checks
          content: {application/json: {schema: {$ref: '#/components/schemas/PurposeEvent'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Stale request revision or idempotency key used with different content, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '422': {description: Bounded request declaration capacity exceeded, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/workbench/budgets/readings:
    post:
      tags: [Budgets]
      operationId: createBudgetReading
      summary: Freeze currently authorized whole-period source budget snapshots
      description: Requires a personnel Session, CSRF and independent budget field grants. No economic event, amount sum or live source request is created. The source period is unaffected by global recent-day filters. Formal calculated-budget and independent-invoice source gaps remain explicit.
      x-permission: workbench.details.read
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BudgetReadingRequest'}}}
      responses:
        '201': {description: "Sealed membership, receive cutoff and current authorization", content: {application/json: {schema: {$ref: '#/components/schemas/BudgetReading'}}}}
        '422': {description: Too many members; no partial reading committed, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WorkspaceNotFound'}
        '409': {$ref: '#/components/responses/WorkspaceConflict'}
        '410': {description: Frozen reading expired, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/workbench/budgets/readings/{reading_id}:
    get:
      tags: [Budgets]
      operationId: getBudgetReading
      summary: Recheck a frozen budget reading against current access
      x-permission: workbench.details.read
      parameters:
        - {in: path, name: reading_id, required: true, schema: {type: string, pattern: '^xbd_[A-Za-z0-9_-]{22}$'}}
      responses:
        '200': {description: Current authorized representation, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetReading'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WorkspaceNotFound'}
        '409': {$ref: '#/components/responses/WorkspaceConflict'}
        '410': {description: Frozen reading expired, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/workbench/budgets/readings/{reading_id}/items:
    get:
      tags: [Budgets]
      operationId: listBudgetItems
      summary: Read authorized source budget comparisons without joining snapshots
      x-permission: workbench.details.read
      parameters:
        - {in: path, name: reading_id, required: true, schema: {type: string, pattern: '^xbd_[A-Za-z0-9_-]{22}$'}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string}, description: Opaque cursor bound to this reading and current authorization}
      responses:
        '200': {description: Current authorized representation, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetItems'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WorkspaceNotFound'}
        '409': {$ref: '#/components/responses/WorkspaceConflict'}
        '410': {description: Frozen reading expired, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/workbench/budgets/readings/{reading_id}/items/{budget_ref}/history:
    get:
      tags: [Budgets]
      operationId: listBudgetHistory
      summary: Read separate historical source snapshots within the parent receive cutoff
      x-permission: workbench.details.read
      parameters:
        - {in: path, name: reading_id, required: true, schema: {type: string, pattern: '^xbd_[A-Za-z0-9_-]{22}$'}}
        - {in: path, name: budget_ref, required: true, description: Opaque XI member UUID from items; not the original source budget name, schema: {type: string, format: uuid}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string}, description: Opaque cursor bound to this reading and current authorization}
      responses:
        '200': {description: Current authorized representation, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetItems'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/WorkspaceNotFound'}
        '409': {$ref: '#/components/responses/WorkspaceConflict'}
        '410': {description: Frozen reading expired, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/work-event-ingest/config:
    get:
      tags: [Runtime]
      operationId: getWorkEventIngestConfig
      summary: Discover exact administrator-bound agent-runtime collections and optional paired UR targets
      description: Requires a dedicated work_event.ingest Bearer identity over HTTPS. No cookie, evidence credential, or unbound collection is accepted. Project and UR target scopes are distinct.
      security: [{serviceBearer: []}]
      x-permission: work_event.ingest
      responses:
        '200': {description: 'Active bindings, readable source/project labels, and current credential expiry', content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/work-event-ingest/items:
    post:
      tags: [Runtime]
      operationId: ingestWorkEventItem
      summary: Durably admit one canonical agent-runtime event or relation assertion
      description: Requires a dedicated work_event.ingest Bearer identity over HTTPS. The transaction rechecks token, identity, exact collection binding, expected collection revision, scope generation, source status, and optional registered UR target. A relation remains a source assertion.
      security: [{serviceBearer: []}]
      x-permission: work_event.ingest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [collection_id, expected_collection_revision, scope_generation, kind, document]
              properties:
                collection_id: {type: string, format: uuid}
                expected_collection_revision: {type: integer, minimum: 1}
                scope_generation: {type: string}
                kind: {type: string, enum: [event, relation]}
                document: {type: object, description: Canonical xinsight.work-event.v1 or xinsight.work-event-relation.v1 metadata document}
      responses:
        '201': {description: Newly committed item and canonical SHA-256 receipt, content: {application/json: {schema: {type: object}}}}
        '200': {description: Byte-identical replay acknowledgement, content: {application/json: {schema: {type: object}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Conflicting bytes or a retryable missing predecessor, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/work-event-ingest/contents:
    post:
      tags: [Runtime]
      operationId: ingestWorkEventReviewBody
      summary: Commit one authorized review body to encrypted custody
      description: Requires a dedicated work_event.ingest Bearer identity over HTTPS and an active body-capture policy. X-XI-Body-Metadata is unpadded base64url JSON bound to the exact collection, event revision, content reference, hash, and byte length. An identical replay returns 200.
      security: [{serviceBearer: []}]
      x-permission: work_event.ingest
      parameters:
        - in: header
          name: X-XI-Body-Metadata
          required: true
          description: Unpadded base64url JSON metadata; encoded header at most 4096 bytes and decoded JSON at most 3072 bytes. plain_bytes must equal Content-Length.
          schema: {type: string, maxLength: 4096}
          x-decoded-schema: {$ref: '#/components/schemas/WorkEventReviewBodyMetadata'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 33554432}
      responses:
        '201': {description: New encrypted body receipt, content: {application/json: {schema: {$ref: '#/components/schemas/WorkEventReviewBodyReceipt'}}}}
        '200': {description: Byte-identical replay receipt, content: {application/json: {schema: {$ref: '#/components/schemas/WorkEventReviewBodyReceipt'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/WorkspaceConflict'}
        '410': {description: Body reservation expired, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '507': {description: Project body quota exhausted, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/work-activity/scopes:
    get:
      tags: [Runtime]
      operationId: listWorkActivityScopes
      summary: Discover the current subject's authorized agent-runtime source and project choices
      x-permission: workbench.details.read
      responses:
