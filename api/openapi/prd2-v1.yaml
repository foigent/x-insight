      parameters:
        - {name: installation_id, in: path, required: true, schema: {type: string, pattern: '^xci_[A-Za-z0-9_-]{22}$'}}
        - {name: operation_id, in: path, required: true, schema: {type: string, pattern: '^xcr_[A-Za-z0-9_-]{22}$'}}
