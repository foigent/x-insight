    put:
      operationId: updateOwnInvestigationQueueFilter
      x-permission: investigation.preferences.write
      description: Human Case read, own subject and CSRF required. Operation identity is subject-scoped; identical
        retries return the original receipt, conflicting payload/revision returns 409. Delete retains a tombstone
        for stable retry. Preferences confer no Case/Finding/citation/seal write. Max body 64KiB.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationQueueFilterCommand'
      responses:
        '200':
          description: Authorized complete-set page or immutable original operation receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationQueueFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
    delete:
      operationId: deleteOwnInvestigationQueueFilter
      x-permission: investigation.preferences.write
      description: Human Case read, own subject and CSRF required. Operation identity is subject-scoped; identical
        retries return the original receipt, conflicting payload/revision returns 409. Delete retains a tombstone
        for stable retry. Preferences confer no Case/Finding/citation/seal write. Max body 64KiB.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationQueueFilterCommand'
      responses:
        '200':
          description: Authorized complete-set page or immutable original operation receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationQueueFilter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-xinsight_session
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: xib opaque token
      description: Hashed, expiring and revocable service identity token with exact per-route permissions
  parameters:
    RuntimeReadingId:
      name: reading_id
      in: path
      required: true
      schema: {type: string, pattern: '^xrt_[A-Za-z0-9_-]{22}$'}
    RuntimeRequestRef:
      name: request_ref
      in: path
      required: true
      schema: {type: string, pattern: '^xrr_[a-f0-9]{64}$'}
    WorkbenchReadingId:
      name: reading_id
      in: path
      required: true
      schema: {type: string, pattern: '^xwr_[A-Za-z0-9_-]{22}$'}
    SessionRef:
      name: session_ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^xr_[A-Za-z0-9_-]{22}$'
    AuthoritativeSessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^xss_[a-f0-9]{64}$'
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CaseId'
    AlertId:
      name: alert_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^xal_[a-f0-9]{64}$'
    GapId:
      name: gap_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceIdentityId:
      name: service_identity_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^xsi_[A-Za-z0-9_-]{22}$'
    FindingId:
      name: finding_id
      in: path
      required: true
      schema: {type: string, pattern: '^xf_[A-Za-z0-9_-]{22}$'}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound synchronizer token returned by Session APIs
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
    ExecutionId:
      name: execution_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ExecutionId'
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: request_id
      in: query
      required: false
      description: >-
        Exact valid UTF-8 value without surrounding whitespace or Unicode
        control characters; mutually exclusive with request_id_prefix.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    RequestIdPrefix:
      name: request_id_prefix
      in: query
      required: false
      description: >-
        Literal valid UTF-8 byte prefix without surrounding whitespace or
        Unicode control characters; mutually exclusive with request_id.
      schema:
        type: string
        minLength: 3
        maxLength: 128
    SourceSystemIdQuery:
      name: source_system_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    Outcome:
      name: outcome
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ExecutionOutcome'
    HasGaps:
      name: has_gaps
      in: query
      required: false
      schema:
        type: boolean
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    AsOf:
      name: as_of
      in: query
      required: false
      description: >-
        Shared UTC investigation snapshot for search/detail/timeline/event/gap
        reads; defaults to server current time, fences both declared ingestion
        and database visibility, and is supported for 24 hours.
      schema:
        type: string
        format: date-time
    RequiredAsOf:
      name: as_of
      in: query
      required: true
      description: Fixed UTC Evidence snapshot; omission is rejected.
      schema:
        type: string
        format: date-time
    SearchLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TimelineLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    GapLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SourceLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
  responses:
    AuthenticationRequired:
      description: A valid product-owned Session is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthenticationFailed:
      description: Generic constant-shape local authentication failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Same-origin, CSRF or role permission enforcement failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SessionNotFound:
      description: Session reference does not identify an active Session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Invalid argument or cursor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ExecutionNotFound:
      description: Execution does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EventNotFound:
      description: Event does not exist inside this execution
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceNotFound:
      description: Product-local record does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    WorkspaceConflict:
      description: Case is sealed or submitted identity snapshots conflict with current Evidence
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConnectorConflict:
      description: Connector invitation, identity or operation conflicts with durable current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConnectorInvitationGone:
      description: Connector invitation expired before consent was registered
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CursorMismatch:
      description: Cursor endpoint, filter, sort or execution mismatch
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: The route supports GET only
      headers:
        Allow:
          schema:
            type: string
            const: GET
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PostMethodNotAllowed:
      description: The route supports POST only
      headers:
        Allow:
          schema:
            type: string
            const: POST
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CursorExpired:
      description: Cursor is older than the supported 24-hour window
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Per-process request budget exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Bounded overload or database unavailable response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Safe internal failure without backend details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ConnectorSyncMutation:
      type: object
      additionalProperties: false
      required: [expected_revision, request_id, auto_sync]
      properties:
        expected_revision: {type: integer, minimum: 1}
        request_id: {type: string, format: uuid}
        auto_sync: {type: boolean}
        cadence_seconds: {type: integer, minimum: 5, maximum: 3600}
    ConnectorSyncRun:
      type: object
      additionalProperties: false
      required: [request_id, revision, started_at, deadline, pages, attempts, state, items, results]
      properties:
        request_id: {type: string}
        revision: {type: integer, minimum: 1}
        started_at: {type: string, format: date-time}
        deadline: {type: string, format: date-time}
        pages: {type: integer, minimum: 0, maximum: 32}
        attempts: {type: integer, minimum: 0, maximum: 64}
        items: {type: integer, minimum: 0}
        state: {type: string, enum: [running, completed, empty, partial, error, cancelled, expired, interrupted]}
        results: {type: object, additionalProperties: {type: string, enum: [done, error, more]}}
    ConnectorSyncSlot:
      type: object
      additionalProperties: false
      required: [worker, revision, busy, started_at, ended_at, last_error]
      properties:
        worker: {type: string, enum: [feed, source, activation, projects, credentials]}
        revision: {type: integer, minimum: 1}
        busy: {type: boolean}
        started_at: {type: string, format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
        last_error: {type: string}
    ConnectorSyncStatus:
      type: object
      additionalProperties: false
      required: [installation_id, last_request_id, auto_sync, cadence_seconds, revision, effective, peer, last_checked_at, last_data_at, last_error, required_workers, workers]
      properties:
        installation_id: {type: string, pattern: '^xci_[A-Za-z0-9_-]{22}$'}
        last_request_id: {type: string}
        auto_sync: {type: boolean}
        cadence_seconds: {type: [integer, 'null'], minimum: 5, maximum: 3600}
        revision: {type: integer, minimum: 1}
        effective: {type: string, enum: [auto_running, manual_running, stopping, quiet, blocked, unknown]}
        peer: {type: string, enum: [unknown]}
        last_checked_at: {type: [string, 'null'], format: date-time}
        last_data_at: {type: [string, 'null'], format: date-time}
        last_error: {type: string}
        required_workers: {type: array, items: {type: string}}
        workers: {type: array, items: {$ref: '#/components/schemas/ConnectorSyncSlot'}}
        run: {$ref: '#/components/schemas/ConnectorSyncRun'}
    ConnectorCredentialRequest:
      type: object
      additionalProperties: false
      description: Go json.Marshal field order is frozen by shared UR/XI credential v1 fixtures; recover requires even empty superseded strings.
      required: [schema_version, kind, installation_id, deployment_id, project_id, final_event_scope, source_binding_sha256, xinsight_origin, unirouter_origin, operation_id, previous_token_sha256, replacement_token]
      properties:
        schema_version: {type: string, const: xinsight.connector-control-credential-request.v1}
        kind: {type: string, enum: [rotate, recover]}
        installation_id: {type: string, pattern: '^xci_[A-Za-z0-9_-]{22}$'}
        deployment_id: {type: string, pattern: '^xid_[A-Za-z0-9_-]{22}$'}
        project_id: {type: string}
        final_event_scope: {type: array, items: {type: string, const: model.request.completed}, minItems: 1, maxItems: 1}
        source_binding_sha256: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        xinsight_origin: {type: string, format: uri}
        unirouter_origin: {type: string, format: uri}
        operation_id: {type: string, pattern: '^xcr_[A-Za-z0-9_-]{22}$'}
        previous_token_sha256: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        replacement_token: {type: string, pattern: '^xib_[A-Za-z0-9_-]{43}$'}
        recovery_id: {type: string, pattern: '^xrr_[A-Za-z0-9_-]{22}$'}
        recovery_ticket: {type: string, pattern: '^xirt_[A-Za-z0-9_-]{43}$'}
        previous_token: {type: string, pattern: '^xib_[A-Za-z0-9_-]{43}$'}
        superseded_operation_id: {type: string}
        superseded_replacement_token_sha256: {type: string}
    ConnectorCredentialConfirm:
      type: object
      additionalProperties: false
      required: [schema_version, operation_id, request_sha256]
      properties:
        schema_version: {type: string, const: xinsight.connector-control-credential-request.v1}
        operation_id: {type: string, pattern: '^xcr_[A-Za-z0-9_-]{22}$'}
        request_sha256: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
    ConnectorCredentialReceipt:
      type: object
      additionalProperties: false
      required: [schema_version, installation_id, deployment_id, project_id, final_event_scope, source_binding_sha256, xinsight_origin, unirouter_origin, operation_id, request_sha256, control_identity_id, previous_token_sha256, replacement_token_sha256, replacement_expires_at, state]
      properties:
        schema_version: {type: string, const: xinsight.connector-control-credential-receipt.v1}
        installation_id: {type: string}
        deployment_id: {type: string}
        project_id: {type: string}
        final_event_scope: {type: array, items: {type: string}}
        source_binding_sha256: {type: string}
        xinsight_origin: {type: string, format: uri}
        unirouter_origin: {type: string, format: uri}
        operation_id: {type: string}
        request_sha256: {type: string}
        control_identity_id: {type: string}
        previous_token_sha256: {type: string}
        replacement_token_sha256: {type: string}
        replacement_expires_at: {type: string, format: date-time}
        state: {type: string, enum: [prepared, committed]}
    ConnectorCredentialRecovery:
      type: object
      additionalProperties: false
      required: [schema_version, installation_id, deployment_id, project_id, final_event_scope, source_binding_sha256, xinsight_origin, unirouter_origin, recovery_id, previous_token_sha256, superseded_operation_id, superseded_replacement_token_sha256, expires_at]
      properties:
        schema_version: {type: string, const: xinsight.connector-control-recovery.v1}
        installation_id: {type: string}
        deployment_id: {type: string}
        project_id: {type: string}
        final_event_scope: {type: array, items: {type: string}}
        source_binding_sha256: {type: string}
        xinsight_origin: {type: string, format: uri}
        unirouter_origin: {type: string, format: uri}
        recovery_id: {type: string}
        previous_token_sha256: {type: string}
        superseded_operation_id: {type: string}
        superseded_replacement_token_sha256: {type: string}
        expires_at: {type: string, format: date-time}
        ticket: {type: string}
        recover_url: {type: string, format: uri}
    ConnectorSetupConsentPut:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, expected_custody_revision, custody]
      properties:
        schema_version: {type: string, const: xinsight.connector-setup-consent.v1}
        request_id: {type: string, format: uuid}
        expected_custody_revision: {type: integer, minimum: 0}
        custody:
          oneOf:
            - {$ref: '#/components/schemas/ReviewCaptureSettings'}
            - {type: 'null'}
    ConnectorSetupResolve:
      type: object
      additionalProperties: false
      required: [invitation_token]
      properties:
        invitation_token: {type: string, pattern: '^xiiv1_[A-Za-z0-9_-]{43}$', writeOnly: true}
    ConnectorSetupConsentView:
      type: object
      additionalProperties: false
      required: [schema_version, installation_id, deployment_id, xi_origin, ur_origin, consent_revision, consent_sha256, expires_at, custody, expected_custody_revision]
      properties:
        schema_version: {type: string, const: xinsight.connector-setup-consent-view.v1}
        installation_id: {type: string, pattern: '^xci_[A-Za-z0-9_-]{22}$'}
        deployment_id: {type: string, pattern: '^xid_[A-Za-z0-9_-]{22}$'}
        xi_origin: {type: string, format: uri}
        ur_origin: {type: string, format: uri}
        consent_revision: {type: integer, const: 1}
        consent_sha256: {$ref: '#/components/schemas/SHA256Ref'}
        expires_at: {type: string, format: date-time}
        custody: {$ref: '#/components/schemas/ReviewCaptureSettings'}
        expected_custody_revision: {type: integer, minimum: 0}
    ConnectorSetupCreated:
      type: object
      additionalProperties: false
      required: [invitation, consent]
      properties:
        invitation: {$ref: '#/components/schemas/ConnectorInvitation'}
        consent: {$ref: '#/components/schemas/ConnectorSetupConsentView'}
    ConnectorSetupPreview:
      type: object
      additionalProperties: false
      required: [schema_version, deployment_id, ur_origin, custody, can_change_custody]
      properties:
        schema_version: {type: string, const: xinsight.connector-setup-preview.v1}
        deployment_id: {type: string, pattern: '^xid_[A-Za-z0-9_-]{22}$'}
        ur_origin: {type: string, format: uri}
        custody: {$ref: '#/components/schemas/ConnectorSetupCustody'}
        can_change_custody: {type: boolean}
    ConnectorSetupCustody:
      type: object
      additionalProperties: false
      required: [desired_revision, effective_revision, settings]
      properties:
        desired_revision: {type: integer, minimum: 0}
        effective_revision: {type: integer, minimum: 0}
        settings:
          oneOf:
            - {$ref: '#/components/schemas/ReviewCaptureSettings'}
            - {type: 'null'}
    ConnectorSetupStatus:
      type: object
      additionalProperties: false
      required: [schema_version, installation_id, deployment_id, consent_revision, state, custody, receiving, issues]
      properties:
        schema_version: {type: string, const: xinsight.connector-setup-status.v1}
        installation_id: {type: string, pattern: '^xci_[A-Za-z0-9_-]{22}$'}
        deployment_id: {type: string, pattern: '^xid_[A-Za-z0-9_-]{22}$'}
        consent_revision: {type: integer, const: 1}
        state: {type: string, enum: [waiting_consent, provisioning, needs_action, waiting_data, ready, failed]}
        custody:
          type: object
          additionalProperties: false
          required: [desired_revision, effective_revision, loaded, settings]
          properties:
            desired_revision: {type: integer, minimum: 0}
            effective_revision: {type: integer, minimum: 0}
            loaded: {type: boolean}
            settings:
              oneOf:
                - {$ref: '#/components/schemas/ReviewCaptureSettings'}
                - {type: 'null'}
        receiving:
          type: object
          additionalProperties: false
          required: [last_success_at, profiles_received, content_received_at, content_read_verified_at]
          properties:
            last_success_at: {type: [string, 'null'], format: date-time}
            profiles_received: {type: array, uniqueItems: true, items: {type: string}}
            content_received_at: {type: [string, 'null'], format: date-time}
            content_read_verified_at: {type: [string, 'null'], format: date-time, description: Accepted protected server read; does not prove browser received all bytes}
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, requires_choice]
            properties:
              code: {type: string}
              requires_choice: {type: boolean}
    ReviewCaptureURWrite:
      type: object
      additionalProperties: false
      description: xi_settings and xi_expected_revision are an optional pair only for the enterprise route; XI desired intent and the immutable UR operation are then committed in one owner transaction. XI effective settings require a later exact-revision confirmation after UR readback.
      required: [delegation_id, delegation_revision, operation_ref, policy]
      properties:
        delegation_id: {type: string, pattern: '^xipg_[1-9][0-9]{0,18}$'}
        delegation_revision: {type: string, pattern: '^[1-9][0-9]{0,18}$'}
        operation_ref: {type: string, pattern: '^xipw_[a-f0-9]{32}$'}
        policy: {type: object, description: UniRouter scoped payload-policy v2 CAS request}
        retry_unconfirmed: {type: boolean, default: false}
        xi_settings: {$ref: '#/components/schemas/ReviewCaptureSettings'}
        xi_expected_revision: {type: integer, minimum: 0}
    ReviewCaptureSettings:
      type: object
      additionalProperties: false
      required: [mode, retention_seconds, project_quota_bytes, max_item_bytes]
      properties:
        mode: {type: string, enum: [disabled, full_content]}
        retention_seconds: {type: integer, minimum: 1, maximum: 31536000}
        project_quota_bytes: {type: integer, minimum: 1, maximum: 1099511627776}
        max_item_bytes: {type: integer, minimum: 0, maximum: 33554432}
    WorkEventScope:
      type: object
      additionalProperties: false
      required: [source_system_id, source_instance, org_id, project_id]
      properties:
        source_system_id: {type: string, format: uuid}
        source_instance: {type: string}
        org_id: {type: string}
        project_id: {type: string}
    WorkEvent:
      type: object
      additionalProperties: false
      description: Canonical source-reported typed metadata; no inline input/output or file body
      required: [schema_version, reporter, event_ref, revision, occurred_at, recorded_at, subject_kind, lifecycle_state, actor, action_kind, content_state, content_refs]
      properties:
        schema_version: {type: string, const: xinsight.work-event.v1}
        reporter: {$ref: '#/components/schemas/WorkEventScope'}
        event_ref: {type: string}
        revision: {type: integer, minimum: 1, maximum: 1000000}
        previous_hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
        occurred_at: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        subject_kind: {type: string, enum: [task, message, model_call, tool_call, resource_action]}
        lifecycle_state: {type: string, enum: [started, completed, failed, unknown]}
        task_ref: {type: string}
        run_id: {type: string}
        model_call_id: {type: string, description: Required for model.requested/completed/failed; absent on public llm_input/llm_output observations lacking a native call ID}
        tool_call_id: {type: string}
        actor:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {type: string, enum: [human, agent, service, unknown]}
            ref: {type: string}
        action_kind: {type: string, description: Prefix task., message., model., tool., or resource. must match subject_kind; message observations do not assert task completion}
        resource:
          type: object
          additionalProperties: false
          required: [ref, name_state]
          properties:
            ref: {type: string}
            name_state: {type: string, enum: [readable, hidden]}
            name: {type: string, maxLength: 512, description: Path-like locator permitted only in authorized readable state}
        content_state: {type: string, enum: [not_captured, pending, referenced]}
        content_refs:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [kind, ref, sha256]
            properties:
              kind: {type: string, enum: [user_input, user_output, model_input, model_output, tool_input, tool_output, resource_before, resource_after]}
              ref: {type: string}
              sha256: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
