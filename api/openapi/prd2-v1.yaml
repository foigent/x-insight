        '404': {$ref: '#/components/responses/WorkspaceNotFound'}
        '409': {$ref: '#/components/responses/WorkspaceConflict'}
        '410': {description: Reading or applicable body retention expired, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        '503': {description: "Body unavailable, integrity failed or reader busy; no source fallback for XI custody", content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
