      operationId: updateFindingResponsibility
      summary: Atomically record human responsibility, deadline, reason and immutable receipt
      description: >-
        Only update_followup responsibility fields are supported. Authorization is checked on every retry.
        Same actor/object/operation_id and normalized content returns the original receipt, even after later
        edits or sealing. Different content conflicts. New actions require both expected versions and an open Case.
