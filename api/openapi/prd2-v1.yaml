    WorkbenchSourceCoverage:
      type: object
      additionalProperties: false
      required: [known_documents, pending_predecessor, economic_not_received, economic_hash_conflicts, media_pending, not_captured, profiles, gaps]
      properties:
        known_documents: {type: integer, minimum: 0}
        pending_predecessor: {type: integer, minimum: 0}
        economic_not_received: {type: integer, minimum: 0}
        economic_hash_conflicts: {type: integer, minimum: 0}
        media_pending: {type: integer, minimum: 0}
        not_captured: {type: integer, minimum: 0}
        profiles: {type: array, uniqueItems: true, items: {type: string, enum: [unirouter.execution-context.v1, unirouter.execution-identity.v1, unirouter.cost-basis.v1]}}
        gaps: {type: array, items: {type: string}}
        requires_attention: {type: boolean, description: Persistent collection attention observed when this reading was created; administrator acknowledgement is required after correction.}
        collection_states:
          description: Frozen states of currently authorized collection registrations; absent in older readings or when no authorized registration was observed. Collection state does not revoke reader access to historical documents.
          type: array
          uniqueItems: true
          items: {type: string, enum: [active, paused, revoked]}
    WorkbenchSourceObservation:
      type: object
      additionalProperties: false
      required: [source_system_id, request_id, profile, stage, source_fact_id, revision, source_hash, envelope_hash, chain_state, economic_state, capture_status, occurred_at, recorded_at]
      properties:
        source_system_id: {type: string, format: uuid}
        request_id: {type: string}
        profile: {type: string, enum: [unirouter.execution-context.v1, unirouter.execution-identity.v1, unirouter.cost-basis.v1]}
        stage: {type: string, enum: [authenticated, admission, dispatch, terminal]}
        source_fact_id: {type: string, pattern: '^uf1_[a-f0-9]{64}$'}
        revision: {type: string, pattern: '^[1-9][0-9]*$'}
        source_hash: {$ref: '#/components/schemas/SHA256Ref'}
        envelope_hash: {$ref: '#/components/schemas/SHA256Ref'}
        chain_state: {type: string, enum: [complete, missing_predecessor]}
        economic_state: {type: string, enum: [received, not_received, hash_mismatch, media_pricing_pending, media_not_eligible, not_evaluated]}
        capture_status: {type: string, enum: [available, not_captured]}
        occurred_at: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
        context: {type: object, description: Authorized immutable execution-context core; absent for pending lineage or denied profile}
        identity: {type: object, description: Authorized immutable execution-identity fields; decimal identifiers remain strings}
        cost_basis: {type: object, description: Authorized immutable cost-basis fields; adds no monetary contribution}
    WorkbenchSourceObservations:
      type: object
      additionalProperties: false
      required: [reading_id, manifest_ref, items]
      properties:
        reading_id: {type: string, pattern: '^xwr_[A-Za-z0-9_-]{22}$'}
        manifest_ref: {$ref: '#/components/schemas/SHA256Ref'}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/WorkbenchSourceObservation'}}
        next_cursor: {type: string, maxLength: 2048}

    PurposeCategory:
      type: string
      description: Bounded development work-purpose vocabulary; customer service is a separate business-domain clue, not a request-purpose category. This is not a frozen enterprise taxonomy.
      enum: [information_query, content_transformation, software_check]
    PurposeBasis:
      type: object
      additionalProperties: false
      required: [evidence_event_id, event_hash]
      properties:
        evidence_event_id: {type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
        event_hash: {$ref: '#/components/schemas/SHA256Ref'}
    PurposeCommand:
      type: object
      additionalProperties: false
      required: [action, expected_revision, idempotency_key, reason]
      properties:
        action: {type: string, enum: [declare, accept, modify, reject, withdraw_declaration, withdraw_adoption]}
        expected_revision: {type: integer, minimum: 0, maximum: 9007199254740990}
        idempotency_key: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$'}
        claim_id: {type: string, pattern: '^xpc_[A-Za-z0-9_-]{22}$'}
        category: {$ref: '#/components/schemas/PurposeCategory'}
        vocabulary: {type: string, const: xinsight.request-purpose.dev.v1}
        basis_refs: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/PurposeBasis'}}
        reason: {type: string, minLength: 1, maxLength: 4000}
        reject_claim_ids: {type: array, maxItems: 256, uniqueItems: true, items: {type: string, pattern: '^xpc_[A-Za-z0-9_-]{22}$'}}
        tags: {type: array, maxItems: 3, uniqueItems: true, items: {$ref: '#/components/schemas/PurposeCategory'}}
      allOf:
        - if: {properties: {action: {enum: [declare, modify]}}}
          then: {required: [category, vocabulary, basis_refs]}
          else: {not: {anyOf: [{required: [category]}, {required: [vocabulary]}, {required: [basis_refs]}, {required: [tags]}]}}
        - if: {properties: {action: {const: declare}}}
          then: {not: {anyOf: [{required: [claim_id]}, {required: [reject_claim_ids]}]}}
          else: {required: [claim_id]}
        - if: {properties: {action: {enum: [reject, withdraw_declaration, withdraw_adoption]}}}
          then: {not: {required: [reject_claim_ids]}}
    PurposeClaim:
      type: object
      additionalProperties: false
      required: [claim_id, category, vocabulary, method, basis_refs, reason, declared_by, declared_at, review_state]
      properties:
        claim_id: {type: string, pattern: '^xpc_[A-Za-z0-9_-]{22}$'}
        category: {$ref: '#/components/schemas/PurposeCategory'}
        vocabulary: {type: string, const: xinsight.request-purpose.dev.v1}
        method: {type: string, const: human_declared}
        basis_refs: {type: array, minItems: 1, maxItems: 32, items: {$ref: '#/components/schemas/PurposeBasis'}}
        reason: {type: string, minLength: 1, maxLength: 4000}
        declared_by: {type: string}
        declared_at: {type: string, format: date-time}
        review_state: {type: string, enum: [pending, accepted, modified, rejected, withdrawn]}
        revises: {type: string, pattern: '^xpc_[A-Za-z0-9_-]{22}$'}
        tags: {type: array, maxItems: 3, uniqueItems: true, items: {$ref: '#/components/schemas/PurposeCategory'}}
    PurposeState:
      type: object
      additionalProperties: false
      required: [revision, claims, status]
      properties:
        revision: {type: integer, minimum: 0, maximum: 9007199254740991}
        claims: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/PurposeClaim'}}
        adopted_claim_id: {type: string, pattern: '^xpc_[A-Za-z0-9_-]{22}$'}
        status: {type: string, enum: [unknown, unreviewed, conflict, adopted]}
        category: {$ref: '#/components/schemas/PurposeCategory'}
    PurposeEvent:
      type: object
      additionalProperties: false
      required: [execution_id, revision, actor, recorded_at, command, previous_hash, state, event_hash]
      properties:
        execution_id: {type: string}
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        actor: {type: string}
        recorded_at: {type: string, format: date-time}
        command: {$ref: '#/components/schemas/PurposeCommand'}
        new_claim_id: {type: string, pattern: '^xpc_[A-Za-z0-9_-]{22}$'}
        previous_hash: {type: string, pattern: '^(sha256:[a-f0-9]{64})?$'}
        state: {$ref: '#/components/schemas/PurposeState'}
        event_hash: {$ref: '#/components/schemas/SHA256Ref'}
    PurposeView:
      type: object
      additionalProperties: false
      required: [execution_id, state, history, can_review, vocabulary]
      properties:
        execution_id: {type: string}
        reading_id: {type: string, pattern: '^xwr_[A-Za-z0-9_-]{22}$'}
        state: {$ref: '#/components/schemas/PurposeState'}
        history: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/PurposeHistoryEntry'}}
        next_before_revision: {type: integer, minimum: 1}
        can_review: {type: boolean}
        vocabulary: {type: string, const: xinsight.request-purpose.dev.v1}
    PurposeReading:
      type: object
      additionalProperties: false
      required: [status, rule_version, manifest_ref]
      properties:
        status: {type: string, enum: [available, unavailable]}
        rule_version: {type: string, const: xinsight.request-purpose-reading.v1}
        manifest_ref: {$ref: '#/components/schemas/SHA256Ref'}

    PurposeHistoryEntry:
      type: object
      additionalProperties: false
      required: [revision, actor, recorded_at, command, previous_hash, event_hash]
      properties:
        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
        actor: {type: string}
        recorded_at: {type: string, format: date-time}
        command: {$ref: '#/components/schemas/PurposeCommand'}
        new_claim_id: {type: string, pattern: '^xpc_[A-Za-z0-9_-]{22}$'}
        previous_hash: {type: string, pattern: '^(sha256:[a-f0-9]{64})?$'}
        event_hash: {$ref: '#/components/schemas/SHA256Ref'}
