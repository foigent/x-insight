  /api/v1/investigation/queue:
    get:
      operationId: listInvestigationQueue
      summary: Read complete investigation scope and stable pages
      x-permission: evidence.read
      description: Human session required. Current Local scope is deployment-wide Case access, with no project ACL.
        Fixed evaluated_at survives ordinary page time; changed data, loaded role/permission binding or filters invalidate
        cursors. Cursors expire after 30 minutes; refresh starts a new page. Sealing does not end follow-up. Counts
        are Findings and do not assert complete security source coverage.
      parameters:
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - current
          - created
          - reassessment
      - name: period
        in: query
        schema:
          type: string
          enum:
          - 24h
          - 7d
          - custom
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: assignee
        in: query
        schema:
          type: string
      - name: progress
        in: query
        schema:
          type: string
          enum:
          - ''
          - unrecorded
          - not_started
          - in_progress
          - ended
      - name: conclusion
        in: query
        schema:
          type: string
          enum:
          - ''
          - unrecorded
          - pending_review
          - supported
          - not_supported
          - insufficient_evidence
      - name: basis
        in: query
        schema:
          type: string
          enum:
          - ''
          - unrecorded
          - unchanged
          - changed
          - unavailable
      - name: case_status
        in: query
        schema:
          type: string
          enum:
          - ''
          - open
          - sealed
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_desc
          - due_asc
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 4096
      responses:
        '200':
          description: Authorized complete-set page or immutable original operation receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationQueuePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/WorkspaceConflict'
  /api/v1/investigation/queue-filters:
    get:
      operationId: listOwnInvestigationQueueFilters
      x-permission: investigation.preferences.write
      description: Requires current human Case read plus personal preferences permission; returns only the authenticated
        subject active filters.
      responses:
        '200':
          description: Authorized complete-set page or immutable original operation receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationQueueFilterList'
        '400':
